org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Molde picks its own ABI (-Pabi / env ORG_GRADLE_PROJECT_abi, default x86_64): one ABI per build keeps disk and time down
disable-abi-filtering=true
