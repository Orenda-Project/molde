# Source of truth for issue labels. Applied by tools/sync-labels.sh.
# Keep one label per line in the form: - name | color | description
# The same names live in tools/issues.py (LABELS); round:1..5 are added here.
# Gates (gate:1-prove ... gate:4-offline in docs/plan/04 section 6) are GitHub
# MILESTONES, not labels. They are listed under "milestones:" and created by sync-labels.sh.
labels:
  - type:sdk | 1d76db | Frozen SDK contract and runtime
  - type:kit | 5319e7 | Design kit, themes, components
  - type:shell | 0e8a16 | The app shell (screens, download, home)
  - type:model-data | fbca04 | Training data and model work
  - type:eval | d93f0b | Evaluation, validator, benchmarks
  - type:docs | c5def5 | Documentation
  - type:process | bfd4f2 | Process and tooling
  - state:ready | 0e8a16 | Has a named bar; builder may start
  - state:building | fbca04 | Builder is working or fixing the last gap
  - state:critic | d93f0b | Waiting for or running the critic
  - state:won | 0e8a16 | Last verdict is WIN in both orders
  - state:needs-human | b60205 | Round 5 without a win, or stuck
  - state:blocked | e99695 | Blocked by another issue
  - needs:sdk-frozen | cfd3d7 | Cannot start until the SDK contract is frozen
  - needs:device | cfd3d7 | Needs a real phone or emulator
  - ui | c2e0c6 | Triggers the 5-viewport layout check
  - urdu-rtl | c2e0c6 | Urdu or right-to-left text involved
  - round:1 | ededed | Critic round 1
  - round:2 | ededed | Critic round 2
  - round:3 | ededed | Critic round 3
  - round:4 | ededed | Critic round 4
  - round:5 | ededed | Critic round 5 (last allowed)
milestones:
  - Gate 1: Prove it (contract, runtime, app, 10 testers)
  - Gate 2: Build the data (5,000 verified examples)
  - Gate 3: Train (>=85% first try on the GGUF)
  - Gate 4: Go offline (closed beta)
