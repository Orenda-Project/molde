<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><link rel="stylesheet" href="../../runtime/web/molde.css"><style>html,body{margin:0;height:100%}#app{height:100vh}</style></head>
<body><div id="app"></div><script type="module">
import { load } from '../../lang/eval.mjs';
import { mount } from '../../runtime/web/render.mjs';
let R = null;
window.show = (src, snap) => {
  if (R && R.destroy) R.destroy();
  const el = document.getElementById('app'); el.innerHTML = '';
  const opts = { now: '2026-11-26T10:30:00Z', seed: 1, currency: 'Rs' };
  if (snap) opts.data = snap;
  const app = load(src, opts);
  R = mount(el, app, { mode: 'light', currency: 'Rs', locale: 'en-US', autoTick: false });
  return true;
};
window.ready = true;
</script></body></html>
