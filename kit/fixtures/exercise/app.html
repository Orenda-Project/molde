<main x-data="{s: store.t('set'), page: 1, ex: '', get cur() { return this.ex || this.s.rows.at(-1)?.exercise }, rest: ui.timer(90, () => ui.toast('Rest is over')), get blocks() {
  const m = {}, last = {}, best = {}, tot = {}, seen = {};
  for (const r of this.s.rows) { const d = new Date(r.at).toLocaleDateString('en-CA'); tot[d] = (tot[d] || 0) + 1; (m[d + r.exercise] ??= {d, ex: r.exercise, sets: []}).sets.push(r) }
  const all = Object.values(m);
  for (const b of all) { b.top = Math.max(...b.sets.map(r => r.kg)); b.delta = last[b.ex] && b.top - last[b.ex].top; b.pr = best[b.ex] != null && b.top > best[b.ex]; best[b.ex] = Math.max(best[b.ex] ?? 0, b.top); last[b.ex] = b }
  return all.reverse().map((b, i, a) => ({...b, n: (!i || a[i - 1].d != b.d) && tot[b.d], pr: b.pr && !seen[b.ex] && (seen[b.ex] = 1)}))
}}">
  <h1>Exercise</h1>
  <m-form :table="s" submit="Log set" keep="exercise,kg,reps"></m-form>
  <div class="card row">
    <div class="stat grow" x-text="Math.floor(rest.left / 60) + ':' + String(rest.left % 60).padStart(2, '0')"></div>
    <button class="btn ghost" @click="rest.running ? rest.stop() : (rest.start(), app.notify(Date.now() + rest.left * 1000, 'Rest is over'))" x-text="rest.running ? 'Pause' : 'Rest'"></button>
  </div>
  <m-chart type="line" :data="blocks.filter(b => b.ex == cur).reverse().map(b => ({k: b.d, v: b.top}))" :label="cur + ', top weight per session (kg)'"></m-chart>
  <div class="list">
    <template x-for="b in blocks.slice(0, page * 8)">
      <div>
        <div class="m-dh" x-show="b.n">
          <b class="grow" :class="b.d == app.today() && 'hi'" x-text="app.fmt(b.d, 'rel')"></b><span class="muted" x-text="b.n + ' sets'"></span>
        </div>
        <div class="item slim">
          <button class="tbtn" @click="ex = b.ex" x-text="b.ex"></button><bdi class="chip" x-show="b.pr">PR</bdi>
          <small class="muted grow" x-show="b.delta" x-text="(b.delta > 0 ? '+' : '') + b.delta + ' kg'"></small>
        </div>
        <template x-for="(r, i) in b.sets">
          <div class="item">
            <bdi class="grow" x-text="(i + 1) + '. ' + (r.kg == null ? '' : r.kg + ' kg × ') + r.reps + (r.kg == null ? ' reps' : '')"></bdi>
            <button x-remove="[s, r]"></button>
          </div>
        </template>
      </div>
    </template>
  </div>
  <button class="btn ghost" x-show="blocks.length > page * 8" @click="page++">Show more history</button>
</main>
