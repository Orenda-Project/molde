<main x-data="{s: store.t('set'), page: 1, ex: '', rest: ui.timer(90, () => ui.toast('Rest is over')), get cur() { return this.ex || this.s.rows.at(-1)?.exercise },
  get blocks() {
    const last = {}, best = {}, seen = {}, g = this.$group(this.s.rows, 'day', 'exercise');
    for (const b of g) { b.top = Math.max(...b.rows.map(r => r.kg ?? r.reps)); b.delta = b.top - (last[b.exercise] ?? b.top); last[b.exercise] = b.top; best[b.exercise] = Math.max(best[b.exercise] ?? 0, b.top) }
    return g.reverse().map((b, i, a) => ({...b, first: !i || a[i - 1].day != b.day, pr: b.top == best[b.exercise] && !seen[b.exercise] && (seen[b.exercise] = 1)}))
  }}">
  <h1>Exercise</h1>
  <m-form :table="s" keep="exercise,kg,reps"></m-form>
  <div class="card row">
    <div class="stat grow" x-text="$clock(rest.left)"></div>
    <button class="btn ghost" @click="rest.running ? rest.stop() : (rest.start(), app.notify(Date.now() + rest.left * 1000, 'Rest is over'))" x-text="rest.running ? 'Pause' : 'Rest'"></button>
  </div>
  <m-chart type="line" :data="blocks.filter(b => b.exercise == cur).reverse()" x="day" y="top" :label="cur"></m-chart>
  <div class="list">
    <template x-for="b in blocks.slice(0, page * 8)">
      <div>
        <div class="m-dh" x-show="b.first" x-text="app.fmt(b.day, 'rel')"></div>
        <div class="item slim">
          <button class="tbtn" @click="ex = b.exercise" x-text="b.exercise"></button><bdi class="chip" x-show="b.pr">PR</bdi>
          <small class="muted grow" x-show="b.delta" x-text="(b.delta > 0 ? '+' : '') + b.delta"></small>
        </div>
        <template x-for="(r, i) in b.rows">
          <div class="item">
            <bdi class="grow" x-text="(i + 1) + '. ' + (r.kg == null ? r.reps + ' reps' : r.kg + ' kg × ' + r.reps)"></bdi>
            <button x-remove="[s, r]"></button>
          </div>
        </template>
      </div>
    </template>
  </div>
  <button class="btn ghost" x-show="blocks.length > page * 8" @click="page++">Show more history</button>
</main>
