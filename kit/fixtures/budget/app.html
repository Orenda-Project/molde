<main x-data="{t: store.t('spend'), cap: store.kv('budget', 60000)}">
  <h1>Budget</h1>
  <m-stat left label="Left this month" :value="t.sum('amount',{since:'month'})" :of="cap.v" unit="PKR"></m-stat>
  <m-chart type="rows" :data="t.group('category','amount',{since:'month'})"></m-chart>
  <m-form :table="t"></m-form>
  <m-list :table="t" title="description" sub="amount" meta="category" by="day"></m-list>
</main>
