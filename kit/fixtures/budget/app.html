<main x-data="{t: store.t('tx')}">
  <h1>Budget</h1>
  <m-stat label="Balance" :value="t.sum('amount',{where:{kind:'income'}}) - t.sum('amount',{where:{kind:'spend'}})" unit="PKR"></m-stat>
  <m-chart type="pie" label="Spending by category" :data="t.group('category','amount',{where:{kind:'spend'}})"></m-chart>
  <m-form :table="t"></m-form>
  <m-list :table="t" title="what" sub="amount" meta="kind"></m-list>
</main>
