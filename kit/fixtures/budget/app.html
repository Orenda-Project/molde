<main x-data="{t: store.t('spend'), cap: store.kv('budget', 80000), mo: 0, get spent() { return this.t.sum('amount', {month: this.mo}) }}">
  <h1>Budget</h1>
  <div class="row">
    <button class="ibtn" aria-label="Previous month" @click="mo--">&lsaquo;</button>
    <b class="grow" x-text="app.fmt($month(mo), 'month')"></b>
    <button class="ibtn" aria-label="Next month" :disabled="!mo" @click="mo++">&rsaquo;</button>
  </div>
  <div class="col">
    <div class="row">
      <bdi class="stat" x-text="Math.abs(cap.v - spent).toLocaleString()"></bdi><bdi class="muted" x-text="'PKR ' + (spent > cap.v ? 'over budget' : 'left')"></bdi>
    </div>
    <div class="bar">
      <i :style="{width: Math.min(100, Math.max(0, spent) / cap.v * 100) + '%'}"></i>
    </div>
    <small class="muted">Budget <bdi x-edit="[cap, 'v', 1, 1e9, 'Monthly budget']"></bdi></small>
  </div>
  <m-chart type="hbar" :data="t.group('category', 'amount', {month: mo})"></m-chart>
  <m-form :table="t" seg @added="mo = 0"></m-form>
  <m-list :table="t" :month="mo" title="description" sub="amount" by="day" edit></m-list>
</main>
