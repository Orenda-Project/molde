<main x-data="{w: store.t('cup'), goal: store.kv('goal', 2000)}">
  <h1>Water</h1>
  <m-stat label="Today" :value="w.sum('amount',{since:'day'})" :of="goal.v" unit="ml"></m-stat>
  <m-chart label="Last 7 days" :table="w" col="amount"></m-chart>
  <m-form :table="w" quick="250,500"></m-form>
</main>
