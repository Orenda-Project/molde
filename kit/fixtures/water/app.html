<main x-data="{w: store.t('cup'), goal: store.kv('goal', 2000), get total() { return this.w.sum('volume', {since: 'day'}) },
  add(v) { const id = this.w.add({volume: v}); ui.toast('Added ' + v, () => this.w.remove(id)) }}">
  <h1>Water</h1>
  <div class="row">
    <svg class="ic muted" width="56" height="108">
      <rect width="56" height="108" />
      <rect x="4" :y="104 - 100 * Math.min(1, total / goal.v)" width="48" :height="100 * Math.min(1, total / goal.v)" fill="var(--accent)" />
    </svg>
    <div class="col grow">
      <div class="row">
        <bdi class="stat" x-text="total.toLocaleString()"></bdi>
      </div>
      <small class="muted">Goal <bdi x-edit="[goal, 'v']"></bdi> ml</small>
    </div>
  </div>
  <div class="row">
    <template x-for="q in [250, 500]">
      <button class="btn ghost grow" @click.throttle="add(q)" x-text="'+' + q"></button>
    </template>
  </div>
  <m-form :table="w" min="1" max="5000"></m-form>
  <m-chart :data="w.series('volume', {last: 7})"></m-chart>
  <m-list :table="w" title="volume" unit="ml"></m-list>
</main>
