<main x-data="{j: store.t('entry'), mood: '', note: '', m: {great: 5, good: 2.5, okay: 0, low: -2.5, awful: -5}}">
  <h1>Journal</h1>
  <form class="card col" @submit.prevent="j.add({mood, note: note.trim()}); mood = note = ''">
    <div class="grid" :style="{'--cols': 5}">
      <template x-for="(q, n) in m">
        <label class="col">
          <input type="radio" class="sr" :value="n" x-model="mood">
          <svg class="ic" viewBox="6 7 12 12" width="48" :stroke="mood == n ? 'var(--accent)' : 'var(--edge)'" :stroke-width="mood == n ? 1.4 : .8">
            <path :d="'M9 9h.4M15 9h.4M8 15Q12 ' + (15 + q) + ' 16 15'" />
          </svg>
          <small x-text="n"></small>
        </label>
      </template>
    </div>
    <label class="field"><textarea x-model="note" maxlength="20000" placeholder="Note"></textarea></label>
    <button class="btn ghost" :disabled="!mood || !note.trim()">Save entry</button>
  </form>
  <m-list :table="j" title="note" sub="mood" by="day" edit></m-list>
</main>
