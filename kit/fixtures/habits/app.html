<main x-data="{h: store.t('habit'), c: store.t('check'), get shown() { return this.h.rows.slice(0, 40) },
  d(i) { return this.$day(1 - i) },
  k(x, i) { return {habit: x.id + '', day: this.d(i)} }}">
  <h1>Habits</h1>
  <div class="row">
    <b class="stat" x-text="Math.max(0, ...shown.map(x => c.streak(k(x, 1))))"></b><span class="muted">day best streak</span>
  </div>
  <div class="list">
    <div class="item grid fit">
      <template x-for="i in 7">
        <small x-text="new Date(d(i) + 'T12:00').toLocaleDateString(undefined, {weekday: 'narrow', day: 'numeric'})"></small>
      </template>
    </div>
    <template x-for="x in shown">
      <div class="item wrap">
        <div class="grow" x-edit="[h, x, 'habit']"></div>
        <button x-remove="[h, x, c, 'habit']"></button>
        <div class="grid fit">
          <template x-for="i in 7">
            <button class="check" :aria-pressed="c.has(k(x, i))" :aria-label="d(i)" @click="c.toggle(k(x, i))"></button>
          </template>
        </div>
      </div>
    </template>
  </div>
  <small class="muted">Last 12 weeks, darker is more</small>
  <div class="grid flow" :style="{'--rows': 7, '--cols': 12}">
    <template x-for="d in c.series(null, {last: 84})">
      <i class="cell" :class="'lv' + Math.min(4, d.v)"></i>
    </template>
  </div>
  <m-form :table="h"></m-form>
</main>
