<main x-data="{h: store.t('habit'), c: store.t('check'), page: 1, sel: 0, get cur() { return this.h.rows.find(x => x.id === this.sel) || this.h.rows[0] }}">
  <h1>Habits</h1>
  <div class="row">
    <b class="stat" x-text="$streaks(c, 'habit').max"></b><span class="muted">Longest current streak, days</span>
  </div>
  <div class="list">
    <div class="item grid fit">
      <template x-for="d in $days($fit(48))">
        <small x-text="app.fmt(d, 'wdd')"></small>
      </template>
    </div>
    <template x-for="x in h.rows.slice(0, page * 40)">
      <div class="item wrap" :class="$hue(x.id)">
        <button class="ibtn ring" :aria-pressed="cur?.id === x.id" :aria-label="'History of ' + x.habit" @click="sel = x.id" x-text="$streaks(c, 'habit')[x.id]"></button>
        <div class="grow" x-edit="[h, x, 'habit']"></div>
        <button x-remove="[h, x, c, 'habit']"></button>
        <div class="grid fit" x-roving>
          <template x-for="d in $days($fit(48))">
            <button class="check" x-toggle="[c, {habit: x.id + ''}, d, x.habit]"></button>
          </template>
        </div>
      </div>
    </template>
  </div>
  <button class="btn ghost" x-show="h.rows.length > page * 40" @click="page++">Show more habits</button>
  <m-form :table="h"></m-form>
  <template x-if="cur">
    <section class="col" :class="$hue(cur?.id)">
      <div class="grid" x-roving="7">
        <template x-for="d in c.series(null, {weeks: 5}).slice(0, 7)">
          <small x-text="app.fmt(d.k, 'wd')"></small>
        </template>
        <template x-for="d in c.series(null, {weeks: 5})">
          <button class="day" x-toggle="[c, {habit: cur?.id + ''}, d.k, cur?.habit]" x-text="app.fmt(d.k, 'day')"></button>
        </template>
      </div>
      <m-chart type="line" :data="$ema(c.series(null, {where: {habit: cur?.id + ''}, last: 90}), .07, 100)" :label="cur?.habit + ': score, last 90 days'"></m-chart>
    </section>
  </template>
</main>
