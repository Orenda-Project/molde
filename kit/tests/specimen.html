<!doctype html>
<html lang="en" data-theme="mint"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Specimen</title>
<link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/kit.css"></head><body>
<main>
  <h1 id="r-h1">Heading</h1>
  <h2 id="r-h2">Section</h2>
  <p id="r-body">Body text on the page background.</p>
  <small id="r-muted" class="muted">Muted text on the page background</small>
  <div class="card"><p id="r-card">Body text on a card.</p><small id="r-card-muted" class="muted">Muted on a card</small>
    <span id="r-chip" class="chip">Chip</span><span id="r-ok" class="ok">Done</span><span id="r-warn" class="warn">Check this</span>
    <button id="r-danger" class="btn danger">Delete</button><button id="r-ghost" class="btn ghost">Ghost</button>
    <label class="field"><span id="r-label">Label</span><input id="r-input" value="Typed text" placeholder="Placeholder"></label></div>
  <button id="r-btn" class="btn">Primary</button>
  <div class="tabs"><button id="r-tab-on" class="tab" aria-selected="true">On</button><button id="r-tab-off" class="tab" aria-selected="false">Off</button></div>
  <fieldset class="m-pick"><legend id="r-legend">Mood</legend><label id="r-opt-on" class="m-opt"><input type="radio" name="m" checked>Great</label><label id="r-opt-off" class="m-opt"><input type="radio" name="m">Good</label></fieldset>
  <div class="empty" id="r-empty">Nothing here yet</div>
  <div class="row"><i id="r-c1" class="m-sw m-sw1"></i><i id="r-c2" class="m-sw m-sw2"></i><i id="r-c3" class="m-sw m-sw3"></i><i id="r-c4" class="m-sw m-sw4"></i><i id="r-c5" class="m-sw m-sw5"></i></div>
  <div class="row"><i id="r-cc1" class="m-sw m-sw1 m-swt">x</i><i id="r-cc2" class="m-sw m-sw2 m-swt">x</i><i id="r-cc3" class="m-sw m-sw3 m-swt">x</i><i id="r-cc4" class="m-sw m-sw4 m-swt">x</i><i id="r-cc5" class="m-sw m-sw5 m-swt">x</i></div>
  <div class="row"><i id="r-c6" class="m-sw m-mood1"></i><i id="r-c7" class="m-sw m-mood2"></i><i id="r-c8" class="m-sw m-mood3"></i><i id="r-c9" class="m-sw m-mood4"></i><i id="r-c10" class="m-sw m-mood5"></i></div>
  <div class="row"><i id="r-cc6" class="m-sw m-mood1 m-swt">x</i><i id="r-cc7" class="m-sw m-mood2 m-swt">x</i><i id="r-cc8" class="m-sw m-mood3 m-swt">x</i><i id="r-cc9" class="m-sw m-mood4 m-swt">x</i><i id="r-cc10" class="m-sw m-mood5 m-swt">x</i></div>
  <div class="row"><span id="r-fc1" class="m-fc m-m1">x</span><span id="r-fc2" class="m-fc m-m2">x</span><span id="r-fc3" class="m-fc m-m3">x</span><span id="r-fc4" class="m-fc m-m4">x</span><span id="r-fc5" class="m-fc m-m5">x</span></div>
  <button id="r-check" class="check" aria-pressed="false" aria-label="x"></button>
</main></body></html>
