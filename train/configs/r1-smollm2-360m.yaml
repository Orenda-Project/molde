# r1 arm 3: SmolLM2-360M-Instruct (Apache 2.0). GPT-2-style BPE: full token mode is checked with tokens/check_gguf_tokenizer.py before use.
model: HuggingFaceTB/SmolLM2-360M-Instruct
add_molde_tokens: true
token_mode: safe
epochs: 5
lr: 5.0e-5
batch_size: 8
grad_accum: 2
eval_every: 50
save_every: 200
es_val_n: 48
es_patience: 2
data_dir: /content/molde/train/data/out-r1
