# r4: Gemma 3 270M full fine-tune on data v3.1 (same data and prompt as the r4 Qwen run), 4 epochs, early stopping on val checker pass.
# Runs on the shared GB10 server "spark" inside ~/kamal/molde next to the Qwen run (together under 30 GB).
model: unsloth/gemma-3-270m-it
add_molde_tokens: true
token_mode: safe
epochs: 4
lr: 5.0e-5
warmup_steps: 20
batch_size: 4
grad_accum: 4
precision: bf16
ckpt_mode: full
eval_every: 1304
save_every: 250
es_val_n: 48
es_bs: 16
es_patience: 2
gpu_mem_gb: 8
data_dir: data/out-r4
lang: lang
