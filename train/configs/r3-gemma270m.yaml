# r3: Gemma 3 270M on data v3 (20.8k pairs), up to 4 epochs with early stopping on val checker pass
# r1 arm 1: Gemma 3 270M instruct (ungated mirror of google/gemma-3-270m-it; the google repo needs manual access approval)
model: unsloth/gemma-3-270m-it
add_molde_tokens: true
token_mode: safe        # llama.cpp splits whitespace-carrying added tokens differently from HF on SentencePiece models (34 of 180 programs differ in full mode, 0 in safe mode)
epochs: 4
lr: 5.0e-5
batch_size: 8
grad_accum: 2
eval_every: 50
save_every: 200
es_val_n: 48
es_patience: 2
data_dir: /content/molde/train/data/out-r3
