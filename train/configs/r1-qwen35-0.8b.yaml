# r1 arm 2: Qwen3.5-0.8B (Qwen/Qwen3.5-0.8B, Apache 2.0, 873M params). L4 needed (fp32 weights + Adam about 14 GB).
model: Qwen/Qwen3.5-0.8B
add_molde_tokens: true
token_mode: safe
epochs: 4
lr: 3.0e-5
batch_size: 4
grad_accum: 4
grad_checkpointing: true
eval_every: 50
save_every: 200
es_val_n: 48
es_patience: 2
chat_kwargs: {enable_thinking: false}
data_dir: /content/molde/train/data/out-r1
