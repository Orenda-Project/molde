# Large arm: Qwen3.5-2B, LoRA r=64 on all linear layers + trainable rows for the added keyword tokens (full fine-tune does not fit a 24 GB L4:
# fp32 master weights + Adam for 1.9B text parameters = about 30 GB).
model: Qwen/Qwen3.5-2B
add_molde_tokens: true
token_mode: safe
lora: true
lora_r: 64
lora_alpha: 128
base_dtype: bf16
epochs: 2
lr: 2.0e-4
warmup_steps: 20
batch_size: 4
grad_accum: 4
grad_checkpointing: true
ckpt_mode: weights
eval_every: 300
save_every: 100000
es_val_n: 0
chat_kwargs: {enable_thinking: false}
data_dir: /content/molde/train/data/out-r2
