# r4: Qwen3.5-0.8B full fine-tune on data v3.1 (round 14 syntax), 3 epochs, early stopping on val checker pass (generated one request at a time:
# batched left-padded generation is wrong for Qwen3.5 linear attention). Runs on the shared GB10 server "spark" inside ~/kamal/molde.
model: Qwen/Qwen3.5-0.8B
add_molde_tokens: true
token_mode: safe
epochs: 3
lr: 3.0e-5
warmup_steps: 20
batch_size: 8
grad_accum: 2
grad_checkpointing: true
precision: bf16
ckpt_mode: full
eval_every: 300
save_every: 100000
es_val_n: 40
es_bs: 1
es_patience: 2
gpu_mem_gb: 30
chat_kwargs: {enable_thinking: false}
data_dir: data/out-r4
lang: lang
out_dir: runs/r4-qwen35-0.8b
