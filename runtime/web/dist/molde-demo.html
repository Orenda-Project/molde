<style>/* Molde runtime design system for MoldeScript level-1 nodes.
   Direction: personal tools on a cheap phone. Character: calm, exact, a little warm.
   World: a pocket notebook and a pen. Surfaces stay neutral; the colour goes into what the
   program draws (a glass, a ring, a heat grid). Signature: the app's own glyph in a small
   accent square next to the date, and figures in tabular numerals.
   Rules: 4 px spacing grid, one type scale (14/16/18/22/32/44), weights 400/500/600, nested radii
   (outer 16, inner controls 10, cells 6), focus ring on every control, targets >= 44 px,
   text >= 14 px, text contrast >= 4.5:1 (checked by tests/check.mjs). No gradients, no glows.
   Colour roles are the language's: accent ink muted soft good warn bad bg surface edge. */

.mo-app {
  /* spacing scale used by `gap N` and `pad N` (0..6) */
  --s0: 0px; --s1: 8px; --s2: 12px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px;
  --r-card: 16px; --r-ctl: 10px; --r-cell: 6px;
  --font: "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);

  /* mint (default), light */
  --bg: #f3f6f4; --surface: #ffffff; --ink: #15211c; --muted: #4f5e57; --soft: #e2eae6; --edge: #d5dfda;
  --accent: #0b6e51; --on-accent: #ffffff; --accent-ink: #0b6e51;
  --good: #17703d; --on-good: #ffffff; --warn: #a8460c; --on-warn: #ffffff; --bad: #b0261c; --on-bad: #ffffff;
  --shadow: 0 1px 2px rgba(16, 24, 20, .05), 0 2px 8px rgba(16, 24, 20, .04);
  --scrim: rgba(12, 18, 15, .38);
  color-scheme: light;
}
.mo-app[data-theme="ocean"] { --bg: #f2f5f9; --ink: #0f1b2b; --muted: #4a5b70; --soft: #e0e7f0; --edge: #d3dce8; --accent: #1a5ca8; --accent-ink: #1a5ca8; --good: #17703d; }
.mo-app[data-theme="plum"]  { --bg: #f6f4f8; --ink: #221a29; --muted: #5c5267; --soft: #ebe5ef; --edge: #dfd7e5; --accent: #763a8c; --accent-ink: #763a8c; }
.mo-app[data-theme="slate"] { --bg: #f3f4f6; --ink: #161a20; --muted: #535b66; --soft: #e3e6ea; --edge: #d6dae0; --accent: #2e5470; --accent-ink: #2e5470; }
.mo-app[data-theme="ink"]   { --bg: #f4f4f7; --ink: #181a26; --muted: #545769; --soft: #e4e5ee; --edge: #d7d9e4; --accent: #3a3f9a; --accent-ink: #3a3f9a; }

.mo-app[data-mode="dark"] {
  --bg: #0f1513; --surface: #17201c; --ink: #e6eeea; --muted: #a0b0a8; --soft: #24302b; --edge: #2d3a34;
  --accent: #5cc6a0; --on-accent: #062219; --accent-ink: #6fd0ad;
  --good: #6fd39c; --on-good: #08230f; --warn: #f2a25e; --on-warn: #2a1404; --bad: #f2877e; --on-bad: #2b0907;
  --shadow: none; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
.mo-app[data-mode="dark"][data-theme="ocean"] { --bg: #0d131b; --surface: #151d28; --ink: #e5ecf5; --muted: #9eadc0; --soft: #212c3a; --edge: #2a3646; --accent: #74afef; --on-accent: #061829; --accent-ink: #84b9f2; }
.mo-app[data-mode="dark"][data-theme="plum"]  { --bg: #141018; --surface: #1d1823; --ink: #efe8f4; --muted: #b3a6bf; --soft: #2b2433; --edge: #352c3e; --accent: #c99be0; --on-accent: #1f0d29; --accent-ink: #d2a9e6; }
.mo-app[data-mode="dark"][data-theme="slate"] { --bg: #111316; --surface: #191c21; --ink: #eaedf0; --muted: #a3aab4; --soft: #252a31; --edge: #2e343c; --accent: #8db8d6; --on-accent: #0a1823; --accent-ink: #9cc3de; }
.mo-app[data-mode="dark"][data-theme="ink"]   { --bg: #111219; --surface: #191b25; --ink: #eceef6; --muted: #a6a9bd; --soft: #252836; --edge: #2f3242; --accent: #a5abf2; --on-accent: #12143a; --accent-ink: #b1b6f4; }

/* ---------- shell ---------- */
.mo-app {
  position: relative; display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 1rem; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  min-height: 100%; overflow: hidden;
}
.mo-app *, .mo-app *::before, .mo-app *::after { box-sizing: border-box; }
.mo-scrollarea { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.mo-screen { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s3) var(--s3) var(--s5); max-width: 720px; margin: 0 auto; width: 100%; }

.mo-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3) 0; min-height: 60px; max-width: 720px; margin: 0 auto; width: 100%; flex: none; }
.mo-head-text { flex: 1 1 auto; min-width: 0; }
.mo-date { display: flex; align-items: center; gap: var(--s1); color: var(--muted); font-size: 0.875rem; }
.mo-mark { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: inline-grid; place-items: center; flex: none; }
.mo-mark svg { width: 16px; height: 16px; }
.mo-title { margin: 0; flex: 1 1 auto; min-width: 0; font-size: 1.25rem; line-height: 1.3; font-weight: 600; overflow-wrap: break-word; }
.mo-iconbtn {
  flex: none; width: 44px; height: 44px; border-radius: var(--r-ctl); border: 1px solid var(--edge);
  background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  transition: background-color .15s var(--ease);
}
.mo-iconbtn svg { width: 20px; height: 20px; }
.mo-iconbtn:hover { background: var(--soft); }

/* ---------- layout blocks ---------- */
.mo-stack { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.mo-row { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: var(--s2); min-width: 0; }
.mo-row > * { min-width: 0; }
.mo-grid { display: grid; gap: var(--s1); min-width: 0; }
.mo-grid > * { min-width: 0; }
.mo-scroll { display: flex; flex-direction: row; gap: var(--s2); overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: 4px; max-width: 100%; }
.mo-scroll > * { flex: none; }
.mo-box { position: relative; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.mo-grow { flex: 1 1 0; }
.mo-row > .mo-text.mo-grow { min-width: 96px; }

.mo-card {
  background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r-card);
  padding: 20px; box-shadow: var(--shadow);
}
.mo-filled { border-radius: var(--r-ctl); }

/* ---------- text ---------- */
.mo-text { margin: 0; font-size: 1rem; overflow-wrap: break-word; }
.mo-big { font-size: 2rem; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em; }
.mo-head-t { font-size: 1.125rem; line-height: 1.35; font-weight: 600; }
.mo-faint { font-size: 0.875rem; color: var(--muted); }
.mo-size-tiny { font-size: 0.875rem; }
.mo-size-small { font-size: 0.875rem; }
.mo-size-large { font-size: 1.375rem; line-height: 1.3; }
.mo-size-huge { font-size: 2.75rem; line-height: 1.1; font-weight: 600; letter-spacing: -0.015em; }
.mo-bold { font-weight: 600; }
.mo-align-start { text-align: start; }
.mo-align-center { text-align: center; }
.mo-align-end { text-align: end; }
.mo-unit { color: var(--muted); font-weight: 400; font-size: .6em; letter-spacing: 0; }
.mo-big .mo-unit, .mo-size-huge .mo-unit { font-size: 1.125rem; }

/* tappable text: same look, real target */
.mo-textbtn {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0; margin: -12px 0;
  background: none; border: 0; color: inherit; font: inherit; cursor: pointer; text-align: inherit;
  text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 4px; text-decoration-thickness: 2px;
}
.mo-textbtn:hover { text-decoration-color: var(--muted); }

.mo-icon { display: inline-grid; place-items: center; width: 24px; height: 24px; color: var(--muted); flex: none; }
.mo-icon svg { width: 20px; height: 20px; }
.mo-divider { border: 0; border-top: 1px solid var(--edge); margin: 0; width: 100%; }
.mo-space { flex: none; }
.mo-image { max-width: 100%; border-radius: var(--r-ctl); display: block; }

/* ---------- buttons ---------- */
.mo-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: var(--r-ctl);
  font: inherit; font-size: 1rem; font-weight: 500; line-height: 1.2; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--edge);
  transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
  overflow-wrap: break-word; text-align: center;
}
.mo-btn:hover { background: var(--soft); }
.mo-btn:active { transform: scale(.98); }
.mo-btn.mo-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.mo-btn.mo-primary:hover { background: var(--accent); filter: brightness(.94); }
.mo-btn[data-fill] { border-color: transparent; }
.mo-btn[data-fill]:hover { filter: brightness(.96); }
.mo-row > .mo-btn { flex: 0 1 auto; }
.mo-row > .mo-btn.mo-grow { flex: 1 1 0; }

/* fills by role (also used by box, card and text color) */
[data-fill="accent"]  { background: var(--accent);  color: var(--on-accent); }
[data-fill="good"]    { background: var(--good);    color: var(--on-good); }
[data-fill="warn"]    { background: var(--warn);    color: var(--on-warn); }
[data-fill="bad"]     { background: var(--bad);     color: var(--on-bad); }
[data-fill="soft"]    { background: var(--soft);    color: var(--ink); }
[data-fill="surface"] { background: var(--surface); color: var(--ink); }
[data-fill="bg"]      { background: var(--bg);      color: var(--ink); }
[data-fill="edge"]    { background: var(--edge);    color: var(--ink); }
[data-fill="ink"]     { background: var(--ink);     color: var(--bg); }
[data-fill="muted"]   { background: var(--muted);   color: var(--bg); }
[data-color="accent"] { color: var(--accent-ink); }
[data-color="ink"]    { color: var(--ink); }
[data-color="muted"]  { color: var(--muted); }
[data-color="good"]   { color: var(--good); }
[data-color="warn"]   { color: var(--warn); }
[data-color="bad"]    { color: var(--bad); }
[data-color="bg"], [data-color="surface"] { color: var(--surface); }
[data-color="soft"], [data-color="edge"] { color: var(--muted); }
[data-fill] [data-color="bg"], [data-fill] [data-color="surface"] { color: inherit; }

/* ---------- tappable areas (box, row, stack with tap) ---------- */
.mo-tap { cursor: pointer; position: relative; border-radius: var(--r-ctl); transition: background-color .15s var(--ease), transform .1s var(--ease); }
.mo-tap:not([data-fill]):not(.mo-card):hover { background: color-mix(in srgb, var(--soft) 60%, transparent); }
.mo-tap:active { transform: scale(.985); }
.mo-box.mo-tap { min-height: 44px; }
.mo-row.mo-tap, .mo-stack.mo-tap { min-height: 44px; }
.mo-swipe { touch-action: pan-y; }
.mo-swiping { transition: none; }

/* ---------- inputs ---------- */
.mo-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mo-label { font-size: 0.875rem; color: var(--muted); font-weight: 500; }
.mo-input {
  width: 100%; min-height: 48px; padding: 10px 12px; border-radius: var(--r-ctl);
  border: 1px solid var(--edge); background: var(--bg); color: var(--ink);
  font: inherit; font-size: 1rem; transition: border-color .15s var(--ease);
}
.mo-card .mo-input { background: var(--bg); }
.mo-input:hover { border-color: var(--muted); }
textarea.mo-input { min-height: 104px; resize: vertical; line-height: 1.5; }
.mo-input::placeholder { color: var(--muted); opacity: 1; }
.mo-input[aria-invalid="true"] { border-color: var(--bad); }
.mo-err { font-size: 0.875rem; color: var(--bad); }

.mo-toggle {
  display: inline-grid; place-items: center; width: 44px; height: 44px; flex: none;
  background: none; border: 0; padding: 0; cursor: pointer; color: var(--on-accent);
}
.mo-toggle .mo-tick {
  width: 32px; height: 32px; border-radius: 9px; border: 2px solid var(--muted); display: grid; place-items: center;
  transition: background-color .15s var(--ease), border-color .15s var(--ease);
}
.mo-toggle .mo-tick svg { width: 20px; height: 20px; opacity: 0; transition: opacity .15s var(--ease); }
.mo-toggle[aria-checked="true"] .mo-tick { background: var(--accent); border-color: var(--accent); }
.mo-toggle[aria-checked="true"] .mo-tick svg { opacity: 1; }
.mo-togglefield { display: flex; align-items: center; gap: var(--s1); min-height: 44px; }

.mo-chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
.mo-chip {
  min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: var(--r-ctl); border: 1px solid var(--edge);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 0.9375rem; cursor: pointer;
  transition: background-color .15s var(--ease), border-color .15s var(--ease);
}
.mo-chip:hover { background: var(--soft); }
.mo-chip[aria-checked="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

.mo-slider { display: flex; align-items: center; gap: var(--s2); min-height: 44px; }
.mo-slider input { flex: 1 1 auto; min-width: 0; height: 44px; accent-color: var(--accent); margin: 0; background: transparent; }
.mo-slider output { min-width: 40px; text-align: end; font-weight: 500; }

/* ---------- drawing ---------- */
.mo-draw { position: relative; display: block; min-width: 0; }
.mo-draw svg { display: block; width: 100%; height: 100%; overflow: visible; }
.mo-draw.mo-tap { border-radius: 50%; }
.mo-draw.mo-tap.mo-draw-rect { border-radius: var(--r-ctl); }
.mo-lbl {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;
  font-size: 1rem; line-height: 1.2; text-align: center;
}
.mo-lbl.mo-big { font-size: 2rem; }
.mo-shape-tap { cursor: pointer; }
.mo-shape-tap:focus { outline: none; }
.mo-shape-tap:focus-visible { outline: none; stroke: var(--ink); stroke-width: 2px; vector-effect: non-scaling-stroke; }

/* svg role colours */
.mo-app svg .f-accent { fill: var(--accent); } .mo-app svg .s-accent { stroke: var(--accent); }
.mo-app svg .f-ink { fill: var(--ink); } .mo-app svg .s-ink { stroke: var(--ink); }
.mo-app svg .f-muted { fill: var(--muted); } .mo-app svg .s-muted { stroke: var(--muted); }
.mo-app svg .f-soft { fill: var(--soft); } .mo-app svg .s-soft { stroke: var(--soft); }
.mo-app svg .f-good { fill: var(--good); } .mo-app svg .s-good { stroke: var(--good); }
.mo-app svg .f-warn { fill: var(--warn); } .mo-app svg .s-warn { stroke: var(--warn); }
.mo-app svg .f-bad { fill: var(--bad); } .mo-app svg .s-bad { stroke: var(--bad); }
.mo-app svg .f-bg { fill: var(--bg); } .mo-app svg .s-bg { stroke: var(--bg); }
.mo-app svg .f-surface { fill: var(--surface); } .mo-app svg .s-surface { stroke: var(--surface); }
.mo-app svg .f-edge { fill: var(--edge); } .mo-app svg .s-edge { stroke: var(--edge); }
.mo-app svg .f-none { fill: none; } .mo-app svg .s-none { stroke: none; }

/* ---------- tab bar ---------- */
.mo-tabs {
  flex: none; display: flex; border-top: 1px solid var(--edge); background: var(--surface);
  padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
}
.mo-tab {
  flex: 1 1 0; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: 0; border-radius: var(--r-ctl); color: var(--muted); font: inherit; font-size: 0.875rem; cursor: pointer;
}
.mo-tab svg { width: 20px; height: 20px; }
.mo-tab[aria-selected="true"] { color: var(--accent-ink); font-weight: 600; }
.mo-tab:hover { background: var(--soft); }

/* ---------- sheet, toast, ask ---------- */
.mo-sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; background: var(--scrim); animation: mo-fade .16s var(--ease); }
.mo-sheet {
  background: var(--surface); border-radius: var(--r-card) var(--r-card) 0 0; padding: var(--s4) var(--s3) var(--s3);
  max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: var(--s3);
  animation: mo-rise .2s var(--ease); border-top: 1px solid var(--edge);
}
.mo-sheet h2 { margin: 0; font-size: 1.125rem; font-weight: 600; }
.mo-sheet-actions { display: flex; gap: var(--s1); flex-wrap: wrap; }
.mo-sheet-actions .mo-btn { flex: 1 1 auto; }
.mo-btn.mo-danger { color: var(--bad); }

.mo-toasts { position: absolute; left: 12px; right: 12px; bottom: 76px; z-index: 30; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.mo-app:not(.mo-has-tabs) .mo-toasts { bottom: 16px; }
.mo-toast {
  pointer-events: auto; display: flex; align-items: center; gap: var(--s2); padding: 4px 4px 4px 16px; min-height: 52px;
  background: var(--ink); color: var(--bg); border-radius: 12px; font-size: 0.9375rem; animation: mo-rise .2s var(--ease);
}
.mo-toast span { flex: 1 1 auto; }
.mo-toast .mo-btn { background: transparent; color: var(--bg); border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.mo-toast .mo-btn:hover { background: color-mix(in srgb, var(--bg) 14%, transparent); }

.mo-ask { padding: var(--s5) var(--s3); display: flex; flex-direction: column; gap: var(--s3); }
.mo-ask .mo-btn { justify-content: flex-start; }
.mo-error { padding: var(--s3); color: var(--bad); font-size: 0.9375rem; white-space: pre-wrap; }

/* ---------- focus ---------- */
.mo-app :focus { outline: none; }
.mo-app :focus-visible { outline: 3px solid var(--accent-ink); outline-offset: 2px; border-radius: var(--r-ctl); }
.mo-input:focus-visible { outline-offset: 0; border-color: var(--accent-ink); }

@keyframes mo-fade { from { opacity: 0; } }
@keyframes mo-rise { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) { .mo-app *, .mo-app *::before, .mo-app *::after { animation: none !important; transition: none !important; } }

/* ---------- additions: generic layout rules and helpers ---------- */
/* a row of two or more stacks with no `grow` shares the width evenly (stat rows) */
.mo-row.mo-row-even { align-items: flex-start; }
.mo-row.mo-row-even > .mo-stack { flex: 1 1 0; min-width: 96px; }
.mo-opt { font-weight: 400; color: var(--muted); }
.mo-opt::before { content: "· "; }
.mo-text.mo-tap { display: flex; align-items: center; min-height: 44px; margin: -8px 0; }
.mo-row.mo-card, .mo-row.mo-card.mo-tap { padding: 12px 16px; min-height: 56px; }
.mo-form { gap: var(--s3); }
.mo-lbl[data-on="accent"] { color: var(--on-accent); }
.mo-lbl[data-on="good"] { color: var(--on-good); }
.mo-lbl[data-on="warn"] { color: var(--on-warn); }
.mo-lbl[data-on="bad"] { color: var(--on-bad); }
.mo-lbl[data-on="ink"], .mo-lbl[data-on="muted"] { color: var(--bg); }
/* computed hues (hue(n) in a formula): one lightness per mode so text on them stays readable */
.mo-app { --hue-l: 36%; --hue-s: 52%; --on-hue: #ffffff; }
.mo-app[data-mode="dark"] { --hue-l: 72%; --hue-s: 48%; --on-hue: #10151a; }
[data-fill="hue"] { background: hsl(var(--hue) var(--hue-s) var(--hue-l)); color: var(--on-hue); }
.mo-app svg .hue-fill { fill: hsl(var(--hue) var(--hue-s) var(--hue-l)); }
.mo-app svg .hue-stroke { stroke: hsl(var(--hue) var(--hue-s) var(--hue-l)); }
[data-color="hue"] { color: hsl(var(--hue) var(--hue-s) var(--hue-l)); }
.mo-lbl[data-on="hue"] { color: var(--on-hue); }
.mo-lbl[data-on="soft"], .mo-lbl[data-on="surface"], .mo-lbl[data-on="bg"], .mo-lbl[data-on="edge"] { color: var(--ink); }

/* ---------- round 2: generic layout rules ---------- */
/* a short screen sits in the middle of the free height instead of stuck to the top */
.mo-scrollarea { display: flex; flex-direction: column; }
.mo-screen { flex: none; margin-top: auto; margin-bottom: auto; }
/* a drawing on its own line (not in a row) is centred in its column */
.mo-stack > .mo-draw, .mo-screen > .mo-draw { margin-inline: auto; }
/* a sideways row shows that it has more */
.mo-scroll { scrollbar-width: none; }

      if (first && !/^(app|ask|lib)\b/.test(canon)) errors.push(new MoError('E_HEADER', ln.no, lib ? 'a library starts with lib "name".' : 'a program starts with app "Name" (or is a single ask line).', lib ? 'add lib "name" as line 1.' : 'add app "My app" as line 1.'));
      else errors.push(syntaxError(ln.no, canon, r));
      first = false;
      skip(ln);
      continue;
    }
    const top = kids(r.tree)[0];
    const lead = top && top.r === 'itext-stmt' && canon.match(/^[a-z][a-z0-9_]*(?![a-z0-9_(])/);
    if ((top && top.r === 'call-stmt' && STMT_WORDS.has(child(top, 'ident').v)) || (lead && STMT_WORDS.has(lead[0]))) {
      // `table drink ml` is a broken table line, not a component called "table"
      const rn = parseText(canon, NONCALL);
      errors.push(syntaxError(ln.no, canon, rn.tree ? { far: 0, expected: [] } : rn));
      skip(ln);
      continue;
    }
    let st;
    try { st = build(r.tree, canon); }
    catch (e) { errors.push(new MoError('E_SYNTAX', ln.no, String(e.message || e), '')); first = false; skip(ln); continue; }
    st.line = ln.no; st.src = canon;
    if (first) {
      first = false;
      if (ln.depth !== 0) errors.push(new MoError('E_INDENT', ln.no, 'the first line cannot be indented.', 'remove the leading spaces.'));
      prog.header = st;
      continue;
    }
    if (prog.header && prog.header.kind === 'ask') {
      errors.push(new MoError('E_ASK', ln.no, 'an ask program is a single line; nothing may follow it.', 'either ask, or build the app, not both.'));
      continue;
    }
    if (ln.depth > MAX_DEPTH) { errors.push(new MoError('E_INDENT', ln.no, `nesting deeper than ${MAX_DEPTH} levels.`, 'flatten the layout or move a part into a def.')); continue; }
    while (stack[stack.length - 1].depth >= ln.depth) stack.pop();
    const parent = stack[stack.length - 1];
    if (parent.dead) { skip(ln); continue; }
    if (parent.depth !== ln.depth - 1) {
      errors.push(new MoError('E_INDENT', ln.no, 'this line is indented more than one level below the line above.', 'indent by exactly two spaces per level.'));
      continue;
    }
    if (!parent.block) {
      errors.push(new MoError('E_CHILD', ln.no, `"${parent.node.kind}" cannot have indented lines under it.`, 'un-indent this line, or put both inside a stack/row/box.'));
      continue;
    }
    st.depth = ln.depth;
    (parent.node.children || parent.node.body).push(st);
    if (BLOCK.has(st.kind)) st.children = [];
    stack.push({ node: st, depth: ln.depth, block: BLOCK.has(st.kind) });
  }
  return prog;
}

// ---------------- tree -> AST ----------------
const only = n => kids(n).filter(k => k.r || k.lit !== undefined);
const str = n => JSON.parse(n.v);
const id = n => n.v;

function build(tree, src) {
  const n = tree.r === 'first-stmt' || tree.r === 'block-stmt' || tree.r === 'leaf-stmt' ? kids(tree)[0] : tree;
  const B = BUILD[n.r];
  if (!B) throw new Error('no builder for ' + n.r);
  return B(n, src);
}

const BUILD = {
  'lib-first': n => ({ kind: 'lib', name: str(child(n, 'string')) }),
  'app-stmt': n => {
    const o = { kind: 'app', name: str(child(n, 'string')), icon: child(n, 'ident') ? id(child(n, 'ident')) : null, theme: null };
    if (child(n, 'theme')) o.theme = lits(child(n, 'theme'))[0];
    return o;
  },
  'ask-stmt': n => {
    const s = children(n, 'string').map(str);
    return { kind: 'ask', question: s[0], options: s.slice(1) };
  },
  'table-stmt': n => { const ids = children(n, 'ident'); return { kind: 'table', name: id(ids[0]), was: lits(n).includes('was') ? id(ids[1]) : null, label: child(n, 'string') ? str(child(n, 'string')) : null, fields: children(n, 'field').map(field) }; },
  'setting-stmt': n => ({ kind: 'setting', ...field(child(n, 'field')), force: lits(n).includes('set') }),
  'state-stmt': n => {
    const st = child(n, 'state-type');
    const o = { kind: 'state', name: id(child(n, 'ident')), type: null, draft: null, init: child(n, 'expr') ? expr(child(n, 'expr')) : child(n, 'word') ? { k: 'str', v: child(n, 'word').v, word: true } : null, keep: lits(n).includes('keep'), was: lits(n).includes('was') ? id(children(n, 'ident')[children(n, 'ident').length - 1]) : null };
    if (child(st, 'type')) o.type = type(child(st, 'type')); else o.draft = id(child(st, 'ident'));
    return o;
  },
  'let-stmt': n => ({ kind: 'let', name: id(child(n, 'ident')), params: children(n, 'param').length ? children(n, 'param').map(paramOf) : null, e: expr(child(n, 'expr')) }),
  'def-stmt': (n, src) => ({ kind: 'def', name: id(child(n, 'ident')), params: children(n, 'param').map(p => ({ ...paramOf(p), dflt: child(p, 'arg') ? src.slice(child(p, 'arg').s, child(p, 'arg').e) : null })) }),
  'call-stmt': (n, src) => ({ kind: 'call', name: id(child(n, 'ident')), args: children(n, 'arg').map(a => src.slice(a.s, a.e)) }),
  'slot-stmt': () => ({ kind: 'slot' }),
  'screen-stmt': n => {
    const ids = children(n, 'ident');
    return { kind: 'screen', name: id(ids[0]), label: str(child(n, 'string')), icon: ids[1] ? id(ids[1]) : null };
  },
  'remind-stmt': n => {
    const w = child(n, 'remind-when');
    const o = { kind: 'remind', text: str(child(n, 'string')), cond: child(n, 'expr') ? expr(child(n, 'expr')) : null };
    if (lits(w)[0] === 'at') {
      o.at = child(w, 'path') ? path(child(w, 'path')) : null;
      o.times = children(w, 'time').map(t => t.v);
      if (o.at) { o.offset = child(w, 'dur') ? (lits(child(w, 'add-op'))[0] === '-' ? -1 : 1) * durSec(child(w, 'dur').v) : 0; o.time = o.times[0] || null; o.times = []; }
      o.days = children(w, 'dayname').map(d => lits(d)[0]);
    } else if (lits(w)[0] === 'monthly') {
      o.monthly = children(w, 'number').map(x => +x.v);
      o.times = children(w, 'time').map(t => t.v);
    } else {
      o.every = durSec(child(w, 'dur').v);
      const ts = children(w, 'time').map(t => t.v);
      o.from = ts[0] || null; o.to = ts[1] || null;
    }
    return o;
  },
  'every-stmt': n => ({ kind: 'every', every: durSec(child(n, 'dur').v), cond: child(n, 'expr') ? expr(child(n, 'expr')) : null, actions: actions(child(n, 'actions')) }),
  'when-stmt': n => ({ kind: 'when', cond: expr(child(n, 'expr')), actions: actions(child(n, 'actions')) }),
  'each-stmt': n => ({ kind: 'each', source: source(child(n, 'source')), as: child(n, 'ident') ? id(child(n, 'ident')) : null, empty: child(n, 'string') ? str(child(n, 'string')) : null }),
  'plot-stmt': n => { const r = children(n, 'range').map(x => children(x, 'sum-expr').map(expr)); return { kind: 'plot', x: r[0], y: r[1], mods: mods(n) }; },
  'tick-stmt': n => ({ kind: 'tick', axis: lits(n).includes('ytick') ? 'y' : 'x', x: expr(child(n, 'expr')), parts: tparts(child(n, 'tparts')) }),
  'if-stmt': n => ({ kind: 'if', cond: expr(child(n, 'expr')) }),
  'else-stmt': () => ({ kind: 'else' }),
  'box-stmt': n => ({ kind: 'box', box: lits(n)[0], cols: child(n, 'number') ? +child(n, 'number').v : null, mods: mods(n) }),
  'draw-stmt': n => { const ns = children(n, 'number'); return { kind: 'draw', w: ns[0] ? +ns[0].v : 100, h: ns[1] ? +ns[1].v : 100, mods: mods(n) }; },
  'poly-stmt': n => ({ kind: 'poly', mods: mods(n) }),
  'pt-stmt': n => { const es = children(n, 'expr'); return { kind: 'pt', x: expr(es[0]), y: expr(es[1]) }; },
  'shape-stmt': n => {
    const shape = lits(n)[0];
    const o = { kind: 'shape', shape, args: [], mods: mods(n) };
    const ek = child(n, 'e3') || child(n, 'e4') || child(n, 'e5');
    if (ek) o.args = flatE(ek).map(expr);
    else if ((shape === 'circle') && child(n, 'expr')) o.args = [expr(child(n, 'expr'))];
    if (shape === 'path') o.d = str(child(n, 'string'));
    if (shape === 'label') { o.args = children(n, 'expr').map(expr); o.parts = tparts(child(n, 'tparts')); }
    return o;
  },
  'text-stmt': n => ({ kind: 'text', parts: tparts(child(n, 'tparts')), mods: mods(n) }),
  'itext-stmt': n => ({ kind: 'text', implicit: true, parts: [child(n, 'string') ? { k: 'str', v: str(child(n, 'string')) } : expr(child(n, 'lead-expr')), ...children(n, 'tpart').map(p => child(p, 'string') ? { k: 'str', v: str(child(p, 'string')) } : expr(child(p, 'expr')))], mods: mods(n) }),
  'button-stmt': n => ({ kind: 'button', parts: tparts(child(n, 'tparts')), mods: mods(n) }),
  'icon-stmt': n => ({ kind: 'icon', icon: primary(child(n, 'primary')), mods: mods(n) }),
  'image-stmt': n => ({ kind: 'image', e: expr(child(n, 'expr')), mods: mods(n) }),
  'space-stmt': n => ({ kind: 'space', size: child(n, 'number') ? +child(n, 'number').v : 1 }),
  'divider-stmt': () => ({ kind: 'divider' }),
  'field-stmt': n => ({ kind: 'field', target: path(child(n, 'path')), label: child(n, 'string') ? str(child(n, 'string')) : null, mods: mods(n) }),
  'toggle-stmt': n => ({ kind: 'toggle', target: path(child(n, 'path')), win: child(n, 'window') ? windowN(child(n, 'window')) : null, where: child(n, 'expr') ? expr(child(n, 'expr')) : null, mods: mods(n) }),
  'choice-stmt': n => ({ kind: 'choice', target: path(child(n, 'path')), mods: mods(n) }),
  'slider-stmt': n => ({ kind: 'slider', target: path(child(n, 'path')), range: rangeLit(child(n, 'range-lit')), mods: mods(n) }),
};

// a parameter: `x num`, or `r item` (a row of table item)
function paramOf(p) {
  const ids = children(p, 'ident');
  return child(p, 'pkind') ? { name: id(ids[0]), kind: lits(child(p, 'pkind'))[0] } : { name: id(ids[0]), kind: 'row', table: id(ids[1]) };
}

function flatE(n) {
  const out = [];
  for (const k of kids(n)) { if (k.r === 'expr') out.push(k); else if (k.r === 'e3' || k.r === 'e4') out.push(...flatE(k)); }
  return out;
}

const DUR = { s: 1, m: 60, h: 3600, d: 86400 };
const durSec = v => +v.slice(0, -1) * DUR[v.slice(-1)];

function field(n) {
  const o = { name: id(child(n, 'ident')), type: type(child(n, 'type')), optional: lits(n).includes('?'), range: null, dflt: null, label: null, unit: null, was: null };
  for (const fm of children(n, 'fmod')) {
    const l = lits(fm)[0];
    if (child(fm, 'range-lit')) o.range = rangeLit(child(fm, 'range-lit'));
    else if (l === '=') o.dflt = lit(child(fm, 'lit'));
    else if (l === 'unit') o.unit = str(child(fm, 'string'));
    else if (l === 'was') o.was = id(child(fm, 'ident'));
    else o.label = str(child(fm, 'string'));
  }
  return o;
}

function type(n) {
  const l = lits(n)[0];
  if (l === 'pick') {
    const opts = children(n, 'option');
    const words = o => children(o, 'word').map(w => w.v);
    const renames = {};
    const options = opts.map(o => {
      const v = child(o, 'string') ? str(child(o, 'string')) : words(o)[0];
      if (lits(o).includes('was')) renames[v] = words(o)[child(o, 'string') ? 0 : 1];
      return v;
    });
    return { t: 'pick', options, renames };
  }
  if (l === 'ref') return { t: 'ref', table: id(child(n, 'ident')) };
  return { t: l };
}

function snum(n) { return (lits(n).includes('-') ? -1 : 1) * +child(n, 'number').v; }
function rangeLit(n) { const s = children(n, 'snum'); return { lo: snum(s[0]), hi: s[1] ? snum(s[1]) : null }; }

function lit(n) {
  const k = only(n)[0];
  if (k.lit === 'yes' || k.lit === 'no') return { k: 'bool', v: k.lit === 'yes' };
  if (k.lit === 'today' || k.lit === 'now') return { k: k.lit };
  if (k.r === 'snum') return { k: 'num', v: snum(k) };
  if (k.r === 'string') return { k: 'str', v: str(k) };
  if (k.r === 'time') return { k: 'time', v: k.v };
  if (k.r === 'datelit') return { k: 'date', v: k.v };
  if (k.r === 'dur') return { k: 'dur', v: durSec(k.v) };
  if (k.r === 'word') return { k: 'word', v: k.v };
  throw new Error('bad literal');
}

function tparts(n) { return children(n, 'tpart').map(p => child(p, 'string') ? { k: 'str', v: str(child(p, 'string')) } : expr(child(p, 'expr'))); }

function mods(n) {
  return children(n, 'mod').map(m => {
    if (child(m, 'size')) return { m: 'size', v: lits(child(m, 'size'))[0] }; // tiny, small, large, huge
    const l = lits(m)[0];
    const o = { m: l };
    if (l === 'alt') o.v = str(child(m, 'string'));
    else if (l === 'bar') o.v = true;
    else if (l === 'align') o.v = lits(child(m, 'align'))[0];
    else if (['pad', 'gap', 'span'].includes(l)) o.v = +child(m, 'number').v;
    else if (['axes', 'gridlines', 'middle', 'full'].includes(l)) o.v = true;
    else if (l === 'tap' || l === 'swipe') o.actions = actions(child(m, 'actions'));
    else if (child(m, 'expr')) o.e = expr(child(m, 'expr'));
    return o;
  });
}

function actions(n) { return children(n, 'action').map(action); }
function action(n) {
  const l = lits(n)[0];
  switch (l) {
    case 'add': return { a: 'add', table: id(child(n, 'ident')), assigns: children(n, 'assign').map(s => ({ name: id(child(s, 'ident')), e: expr(child(s, 'expr')) })) };
    case 'set':
      if (lits(n)[1] === 'all') { const es = children(n, 'expr'); return { a: 'setall', target: path(child(n, 'path')), e: expr(es[0]), where: es[1] ? expr(es[1]) : null }; }
      return { a: 'set', target: path(child(n, 'path')), e: expr(child(n, 'expr')) };
    case 'toggle': return { a: 'toggle', target: path(child(n, 'path')), win: child(n, 'window') ? windowN(child(n, 'window')) : null, where: child(n, 'expr') ? expr(child(n, 'expr')) : null };
    case 'remove': if (child(n, 'query')) return { a: 'removeall', q: query(child(n, 'query')) }; return { a: 'remove', e: expr(child(n, 'expr')) };
    case 'edit': return { a: l, e: expr(child(n, 'expr')) };
    case 'save': case 'go': return { a: l, name: id(child(n, 'ident')) };
    case 'notify': return { a: 'notify', parts: tparts(child(n, 'tparts')) };
    case 'after': return { a: 'after', every: durSec(child(n, 'dur').v), act: action(child(n, 'action')) };
    case 'remind': return { a: 'remind', text: str(child(n, 'string')), e: expr(child(n, 'expr')) };
    default: return { a: 'param', name: id(child(n, 'ident')) };
  }
}

function source(n) {
  const k = only(n)[0];
  if (k.lit === 'days') return { k: 'days', win: windowN(child(n, 'window')) };
  if (k.lit === 'options') return { k: 'options', path: path(child(n, 'path')) };
  if (k.r === 'list') return { k: 'list', items: children(k, 'lit').map(lit) };
  if (k.r === 'range') { const s = children(k, 'sum-expr'); return { k: 'range', a: expr(s[0]), b: expr(s[1]) }; }
  if (k.r === 'query') return { k: 'query', q: query(k) };
  throw new Error('bad source');
}

function query(n) {
  const ls = lits(n);
  const es = children(n, 'expr');
  const q = { path: path(child(n, 'path')), win: child(n, 'window') ? windowN(child(n, 'window')) : null, where: ls.includes('where') ? expr(es[0]) : null, by: null, sort: null, desc: false, top: null };
  if (child(n, 'group')) { const g = child(n, 'group'); q.by = child(g, 'path') ? path(child(g, 'path')) : lits(g)[0]; if (q.by.k === 'path' && !q.by.parts.length && q.by.head !== 'it') q.by = q.by.head; }
  if (ls.includes('sort')) { q.sort = expr(es[ls.includes('where') ? 1 : 0]); q.desc = ls.includes('desc'); }
  if (ls.includes('shuffle')) q.shuffle = true;
  if (child(n, 'number')) q.top = +child(n, 'number').v;
  return q;
}

function windowN(n) {
  const ls = lits(n);
  const l = ls[0];
  if (l === 'today' || l === 'yesterday' || l === 'all') return { k: l };
  if (l === 'prev') return { k: 'prev', p: lits(child(n, 'period'))[0] };
  if (l === 'last') return { k: 'last', n: +child(n, 'number').v, unit: lits(child(n, 'periods'))[0] };
  if (l === 'on') return { k: 'on', e: primary(child(n, 'primary')) };
  if (child(n, 'period')) return { k: 'period', p: lits(child(n, 'period'))[0], of: child(n, 'primary') ? primary(child(n, 'primary')) : null };
  return { k: 'param', name: id(child(n, 'ident')) };
}

function path(n) {
  const ids = children(n, 'ident').map(id);
  const it = lits(n)[0] === 'it';
  return it ? { k: 'path', head: 'it', parts: ids } : { k: 'path', head: ids[0], parts: ids.slice(1) };
}

// ---- expressions ----
function expr(n) {
  switch (n.r) {
    case 'expr': return chain(n, 'and-expr', 'or');
    case 'and-expr': return chain(n, 'not-expr', 'and');
    case 'not-expr': return child(n, 'not-expr') ? { k: 'not', a: expr(child(n, 'not-expr')) } : expr(child(n, 'cmp-expr'));
    case 'cmp-expr': {
      const s = children(n, 'sum-expr');
      if (s.length === 1) return expr(s[0]);
      return { k: 'bin', op: lits(child(n, 'cmp-op'))[0], a: expr(s[0]), b: expr(s[1]) };
    }
    case 'sum-expr': return opchain(n, 'prod-expr', 'add-op');
    case 'prod-expr': return opchain(n, 'unary', 'mul-op');
    case 'unary': return child(n, 'unary') ? { k: 'neg', a: expr(child(n, 'unary')) } : primary(child(n, 'primary'));
    case 'primary': return primary(n);
    case 'lead-expr': return opchain(n, 'lead-prod', 'add-op', 'prod-expr');
    case 'lead-prod': return opchain(n, 'lead-unary', 'mul-op', 'unary');
    case 'lead-unary': {
      const k = only(n)[0];
      if (k.lit === '-') return { k: 'neg', a: expr(child(n, 'unary')) };
      if (k.lit === '(') return { k: 'paren', a: expr(child(n, 'expr')) };
      if (k.r === 'number') return { k: 'num', v: +k.v };
      if (k.r === 'lead-ident') return { k: 'path', head: child(k, 'ident').v, parts: [] };
      if (k.r === 'ident' || k.lit === 'it') { const ids = children(n, 'ident').map(id); return k.lit === 'it' ? { k: 'path', head: 'it', parts: ids } : { k: 'path', head: ids[0], parts: ids.slice(1) }; }
      return func(k);
    }
  }
  throw new Error('bad expr ' + n.r);
}
function chain(n, sub, op) {
  const xs = children(n, sub).map(expr);
  return xs.reduce((a, b) => ({ k: 'bin', op, a, b }));
}
function opchain(n, sub, opRule, sub2) {
  const parts = only(n).filter(k => k.r === sub || k.r === opRule || k.r === sub2);
  let acc = expr(parts[0]);
  for (let j = 1; j < parts.length; j += 2) acc = { k: 'bin', op: lits(parts[j])[0], a: acc, b: expr(parts[j + 1]) };
  return acc;
}
const COLORS = new Set(['accent', 'ink', 'muted', 'soft', 'good', 'warn', 'bad', 'bg', 'surface', 'edge']);
function primary(n) {
  const k = only(n)[0];
  if (k.lit === 'yes' || k.lit === 'no') return { k: 'bool', v: k.lit === 'yes' };
  if (k.lit === 'today' || k.lit === 'now' || k.lit === 'index' || k.lit === 'pi') return { k: k.lit };
  if (k.r === 'cword') return { k: 'word', v: k.v };
  if (k.lit === '(') return { k: 'paren', a: expr(child(n, 'expr')) };
  if (k.r === 'color') return { k: 'color', v: lits(k)[0] };
  if (k.r === 'number') return { k: 'num', v: +k.v };
  if (k.r === 'string') return { k: 'str', v: str(k) };
  if (k.r === 'time') return { k: 'time', v: k.v };
  if (k.r === 'datelit') return { k: 'date', v: k.v };
  if (k.r === 'dur') return { k: 'dur', v: durSec(k.v) };
  if (k.r === 'path') return path(k);
  if (k.r === 'func') { const f = func(k); const parts = children(n, 'ident').map(id); return parts.length ? { k: 'member', e: f, parts } : f; } // last(t).name
  throw new Error('bad primary');
}
const FOLD = { 'count(': 'countof', 'sum(': 'sumof', 'min(': 'minof', 'max(': 'maxof' };
function func(n) {
  const f = only(n)[0];
  if (f.r === 'agg') return { k: 'agg', fn: lits(f)[0].slice(0, -1), q: query(child(n, 'query')) };
  if (f.r === 'fold') {
    const o = { k: 'fold', fn: FOLD[lits(f)[0]], src: source(child(n, 'source')), e: expr(child(n, 'expr')) };
    // min(a, b) / max(a, b) of two values reads the same as a fold over a table a: the checker decides by a's type
    const q = o.src.k === 'query' && o.src.q;
    if ((o.fn === 'minof' || o.fn === 'maxof') && q && !q.win && !q.where && !q.by && !q.sort && !q.top && !q.shuffle) o.pair = { k: 'fn', fn: o.fn.slice(0, 3), args: [q.path, o.e] };
    return o;

          this.lets.set(s.name, { t: 'fn', ret: t });
          this.readonly.add(s.name);
          return;
        }
        const t = this.expr(s.e);
        if (['rows', 'draft', 'group'].includes(tname(t))) this.err('E_TYPE', `let names a value; ${show(t)} is not one.`, 'name a number, text, date or row.');
        if (this.declare(s.name, t, cx)) this.lets.set(s.name, t);
        this.readonly.add(s.name);
        return;
      }
      case 'def': if (!cx.top) this.err('E_CONTEXT', 'def must be at the top level.', 'move the def to column 1.'); return;
      case 'screen': {
        if (!cx.top) return this.err('E_CONTEXT', 'screen must be at the top level.', 'move it to column 1.');
        if (this.taken(s.name)) return this.err('E_DUP', `the name "${s.name}" is already used (screens share names with tables, settings and states).`, 'pick a different screen name.');
        if (s.icon && !ICONS.has(s.icon)) this.err('E_ICON', `unknown icon "${s.icon}".`, iconHint(s.icon));
        this.screens.set(s.name, s);
        return this.block(s.children, { ...cx, top: false });
      }
      case 'remind': {
        topOnly();
        if (s.at) {
          const t = this.path(s.at, 'rows');
          if (!isAny(t) && !(tname(t) === 'rows' && t.field && ['time', 'date', 'when'].includes(tname(t.ftype))))
            this.err('E_TYPE', 'remind at needs times like 8:00 or a time/date column like med.time.', 'write remind "Text" at 8:00 or at table.field.');
          else if (!isAny(t) && s.time && tname(t.ftype) === 'time') this.err('E_TYPE', `${t.table}.${t.field} is already a time; "at TIME" after it is for date columns.`, 'remove the second at.');
        }
        if (s.monthly && s.monthly.some(d => d < 1 || d > 31)) this.err('E_RANGE', 'monthly days must be 1 to 31 (31 means the last day in short months).', 'write monthly on 1 at 9:00.');
        if (s.cond) this.bool(s.cond, 'the remind condition');
        return;
      }
      case 'every': case 'when':
        if (s.cond) this.bool(s.cond, `the ${s.kind} condition`);
        return this.actions(s.actions);
      case 'each': {
        const item = this.source(s.source);
        const scope = { it: s.as ? this.curIt() : item, names: new Map(), each: true, asName: s.as || null, asItem: item };
        if (s.as) { scope.names.set(s.as, item); this.readonly.add(s.as); }
        this.scopes.push(scope);
        this.list(s.children, { ...cx, top: false });
        this.scopes.pop();
        return;
      }
      case 'if': this.bool(s.cond, 'the if condition'); return this.block(s.children, { ...cx, top: false });
      case 'else':
        if (!prev || prev.kind !== 'if') this.err('E_CONTEXT', 'else must come right after an if block at the same indentation.', 'put else under the matching if.');
        return this.block(s.children, { ...cx, top: false });
      case 'box': this.mods(s.mods); return this.block(s.children, { ...cx, top: false });
      case 'use': return this.block(s.children, { ...cx, top: false });
      case 'draw': case 'plot':
        if (cx.draw) this.err('E_CONTEXT', `a ${s.kind} cannot be inside a draw or plot.`, 'close the first one first.');
        if (s.kind === 'plot') [...s.x, ...s.y].forEach((e, i) => this.num(e, `the plot ${i < 2 ? 'x' : 'y'} range`));
        this.mods(s.mods);
        return this.block(s.children, { ...cx, top: false, draw: s });
      case 'tick':
        if (!cx.draw || cx.draw.kind !== 'plot') this.err('E_CONTEXT', `${s.axis === 'y' ? 'ytick' : 'tick'} labels an axis of a plot; it must be inside plot.`, 'indent it under a plot line.');
        this.num(s.x, s.axis === 'y' ? 'ytick y' : 'tick x'); this.parts(s.parts);
        return;
      case 'poly':
        if (!cx.draw) this.err('E_CONTEXT', 'poly is a drawing shape; it must be inside draw.', 'indent it under a draw line.');
        this.mods(s.mods);
        return this.block(s.children, { ...cx, top: false, poly: true });
      case 'pt':
        if (!cx.poly) this.err('E_CONTEXT', 'pt is a point of a poly; it must be inside poly.', 'indent it under a poly line.');
        this.num(s.x, 'pt x'); this.num(s.y, 'pt y');
        return;
      case 'shape':
        if (!cx.draw) this.err('E_CONTEXT', `${s.shape} is a drawing shape; it must be inside draw.`, 'indent it under a draw line.');
        s.args.forEach((a, i) => this.num(a, `${s.shape} value ${i + 1}`));
        if (s.parts) this.parts(s.parts);
        return this.mods(s.mods);
      case 'text': {
        // a line that starts with a bare unknown word: most likely a component or statement that does not exist
        const p0 = s.implicit && s.parts[0];
        if (p0 && p0.k === 'path' && !p0.parts.length && this.compSig && this.compSig(p0.head) !== null)
          return this.err('E_SYNTAX', `"${p0.head}" is a component, so this line is a component call, but cannot read the values of ${p0.head}; they are separated by commas.`, `write ${p0.head} ${this.compSig(p0.head)}; to show a value with the same name, start the line with text.`);
        if (p0 && p0.k === 'path' && p0.head !== 'it' && !p0.parts.length && !this.lookup(p0.head) && !this.tables.has(p0.head) && !this.options.has(p0.head) && !this.failed.has(p0.head))
          return this.err('E_UNKNOWN_COMPONENT', `there is no component, statement or value called "${p0.head}".`, `start the line with a statement from SPEC.md, a component (${(this.compNames || []).join(', ')}) or a declared value.`);
        this.parts(s.parts); return this.mods(s.mods);
      }
      case 'button':
        this.parts(s.parts); this.mods(s.mods);
        if (!s.mods.some(m => m.m === 'tap')) this.err('E_ACTION', 'a button needs tap and an action.', 'write button "Add" tap add drink ml = 250 (or tap set, toggle, remove, edit, go, notify).');
        return;
      case 'icon': {
        const e = s.icon;
        if (e.k === 'path' && !e.parts.length && !this.lookup(e.head)) { if (!ICONS.has(e.head)) this.err('E_ICON', `unknown icon "${e.head}".`, iconHint(e.head)); }
        else { const t = this.expr(e); if (!isAny(t) && !TEXTUAL.has(tname(t)) && tname(t) !== 'icon') this.err('E_TYPE', 'icon needs an icon name or a text holding one.', 'write icon heart.'); }
        return this.mods(s.mods);
      }
      case 'image': { const t = this.expr(s.e); if (!isAny(t) && tname(t) !== 'image') this.err('E_TYPE', `image needs an image field, got ${show(t)}.`, 'add a field of type image to the table.'); return this.mods(s.mods); }
      case 'space': case 'divider': case 'slot': return;
      case 'field': {
        const t = this.target(s.target, true);
        if (tname(t) === 'rows') this.err('E_TARGET', 'field edits a state, a setting, a new row (state d new t) or a row field; not a table.', 'use form or state d new table + field d.');
        return this.mods(s.mods);
      }
      case 'toggle': this.toggleT(s); return this.mods(s.mods);
      case 'choice': {
        const t = this.target(s.target);
        if (!isAny(t) && tname(t) !== 'pick' && tname(t) !== 'bool' && tname(t) !== 'ref') this.err('E_TYPE', `choice needs a pick, ref or yes/no value, got ${show(t)}.`, 'give the state a pick type: state x pick A|B = A.');
        return this.mods(s.mods);
      }
      case 'slider': {
        const t = this.target(s.target);
        if (!isAny(t) && !isNum(t) && tname(t) !== 'dur') this.err('E_TYPE', `slider needs a number, got ${show(t)}.`, 'use a num state or setting.');
        if (s.range.hi === null || s.range.hi <= s.range.lo) this.err('E_RANGE', 'a slider needs a range like 0..10 with the second number bigger.', 'write slider x 0..10.');
        return this.mods(s.mods);
      }
    }
    this.err('E_SYNTAX', `unexpected statement ${s.kind}.`, '');
  }

  mods(ms) {
    const seen = new Set();
    for (const m of ms) {
      if (seen.has(m.m)) this.err('E_DUP', `"${m.m}" appears twice on this line.`, 'keep one.');
      seen.add(m.m);
      if (m.m === 'tap' || m.m === 'swipe') this.actions(m.actions);
      else if (m.m === 'bar' && this.curKind !== 'row') this.err('E_CONTEXT', 'bar marks the app bar row (the title and the main action); it goes on a row.', 'write row bar, with the title and one button inside.');
      else if (['color', 'fill', 'stroke'].includes(m.m)) { const t = this.expr(m.e); if (!isAny(t) && t !== 'color') this.err('E_TYPE', `${m.m} needs a colour (${COLORS.join(', ')} or hue(0..360)), got ${show(t)}.`, `write ${m.m} accent, or ${m.m} if(x > 0, good, bad).`); }
      else if (m.e) this.num(m.e, m.m);
    }
  }

  block(children, cx) { this.scopes.push({ it: this.curIt(), names: new Map(), each: this.inEach() }); this.list(children || [], cx); this.scopes.pop(); }
  curIt() { for (let i = this.scopes.length - 1; i >= 0; i--) if (this.scopes[i].it) return this.scopes[i].it; return null; }
  inEach() { return this.scopes.some(s => s.each); }
  asNames() { return this.scopes.filter(s => s.asName).map(s => s.asName); }

  table(s) {
    if (this.taken(s.name)) return this.err('E_DUP', `the name "${s.name}" is already used.`, 'pick a different table name.');
    if (s.was && s.was === s.name) this.err('E_DUP', `table ${s.name} cannot be renamed from itself.`, 'remove "was".');
    if (s.was && this.tables.has(s.was) && !this.tables.get(s.was).decl.was) this.err('E_DUP', `table ${s.name} says it was ${s.was}, but ${s.was} is still declared (and not renamed itself).`, `remove "table ${s.was}" or the "was ${s.was}"; to swap two names, give both tables a was.`);
    const fields = new Map();
    const was = new Set();
    for (const f of s.fields) {
      if (f.name === 'at' || f.name === 'id') this.err('E_RESERVED', `"${f.name}" is a built-in field of every row.`, `every row already has id (its number) and at (when it was added); remove ${f.name} or rename it, for example ${f.name === 'id' ? 'code' : 'when_done'}.`);
      if (fields.has(f.name)) this.err('E_DUP', `field "${f.name}" appears twice in ${s.name}.`, 'remove one or rename it.');
      if (f.was && was.has(f.was)) this.err('E_DUP', `two fields say they were ${f.was}; only one can take its values.`, 'keep one was.');
      else if (f.was && s.fields.some(g => g.name === f.was && !g.was)) this.err('E_DUP', `field ${f.name} says it was ${f.was}, but ${f.was} is still a field (and not renamed itself).`, `remove the field ${f.was} or the "was"; to swap two names, give both fields a was.`);
      if (f.was) was.add(f.was);
      if (f.type.t === 'ref' && !this.tables.has(f.type.table) && f.type.table !== s.name) {
        this.failed.set(`${s.name}.${f.name}`, this.failed.get(f.type.table) || this.line);
        this.reportedFailed.add(`${s.name}.${f.name}`);
        if (!this.followOn(f.type.table)) this.err('E_REF', `field ${f.name} links to table "${f.type.table}", which is not declared above.`, `declare table ${f.type.table} on an earlier line.`);
        continue; // a broken link is left out so later lines do not trip on it
      }
      this.fieldDecl(f, s.name);
      fields.set(f.name, f);
    }
    this.tables.set(s.name, { name: s.name, fields, decl: s });
  }

  fieldDecl(f, table) {
    const t = this.fieldType(f.type);
    if (f.type.t === 'pick') {
      const seen = new Set();
      for (const o of f.type.options) {
        if (seen.has(o)) this.err('E_DUP', `option "${o}" appears twice.`, 'remove the repeat.');
        seen.add(o); this.options.add(o);
        if (COLORS.includes(o)) this.err('E_OPTION', `option "${o}" is also a colour word, so ${f.name} = ${o} would read as the colour.`, `write the option with a capital letter: ${o[0].toUpperCase() + o.slice(1)}.`);
        else if (this.lookup(o) || this.tables.has(o)) this.err('E_OPTION', `option "${o}" has the same name as your ${this.tables.has(o) ? 'table' : 'state, setting or let'} ${o}, so a bare ${o} would mean that.`, `write the option with a capital letter (${o[0].toUpperCase() + o.slice(1)}) or rename the ${this.tables.has(o) ? 'table' : 'value'}.`);
      }
    }
    if (f.range && !isNum(t) && tname(t) !== 'dur') this.err('E_RANGE', `a range like 1..10 only fits number fields, not ${show(t)}.`, 'remove the range.');
    if (f.range && f.range.hi !== null && f.range.hi < f.range.lo) this.err('E_RANGE', 'the range is backwards.', 'write the small number first, like 1..10.');
    if (f.dflt) {
      const d = f.dflt;
      if (f.type.t === 'pick') {
        const v = d.k === 'word' || d.k === 'str' ? d.v : null;
        if (v === null || !f.type.options.includes(v)) this.err('E_DEFAULT', `the default of ${f.name} must be one of its options (${f.type.options.join(', ')}).`, `write = ${f.type.options[0]}.`);
      } else {
        const lt = { num: 'num', str: 'text', time: 'time', date: 'date', dur: 'dur', bool: 'bool', today: 'date', now: 'when', word: 'text' }[d.k];
        if (!this.compatible(t, lt)) this.err('E_DEFAULT', `the default of ${f.name} is ${show(lt)} but the field is ${show(t)}.`, 'make the default match the type.');
        if (d.k === 'num' && f.range && (d.v < f.range.lo || (f.range.hi !== null && d.v > f.range.hi))) this.err('E_RANGE', `the default ${d.v} is outside ${f.range.lo}..${f.range.hi ?? ''}.`, 'pick a default inside the range.');
      }
    }
  }
  fieldType(type) {
    if (!type) return ANY;
    if (type.t === 'pick') { type.options.forEach(o => this.options.add(o)); return { t: 'pick', options: type.options }; }
    return type.t === 'ref' ? { t: 'ref', table: type.table } : type.t;
  }

  lookup(name) {
    for (let i = this.scopes.length - 1; i >= 0; i--) if (this.scopes[i].names.has(name)) return this.scopes[i].names.get(name);
    if (this.states.has(name)) return this.states.get(name);
    if (this.settings.has(name)) return this.settings.get(name);
    if (this.lets.has(name)) return this.lets.get(name);
    return null;
  }
  writable(name) {
    for (let i = this.scopes.length - 1; i >= 0; i--) if (this.scopes[i].names.has(name)) return !this.readonly.has(name) || this.states.has(name);
    if (this.lets.has(name)) return false;
    return this.states.has(name) || this.settings.has(name);
  }

  // ---------- paths ----------
  itHint() {
    const as = this.asNames();
    if (this.via) return `inside "${this.via}", "it" means that component's own item (for example each day of a chart). To use the item of an outer each, write "each X as NAME" and pass NAME.field (for example: each habit as h, then ${this.via} ..., count(h.check on it)).`;
    if (as.length) return `this each names its item "${as[as.length - 1]}"; write ${as[as.length - 1]}.field (with "as", "it" stays the outer item).`;
    return 'wrap this in each, or name the table instead.';
  }

  // mode: 'value' (a value), 'rows' (a table query), 'target' (something to write)
  // constrain.mjs puts a probe name where the model is about to write a name; record what fits there
  probeHere(mode) {
    const names = new Set();
    for (const sc of this.scopes) for (const k of sc.names.keys()) names.add(k);
    for (const m of [this.states, this.settings, this.lets]) for (const [k, v] of m) if (tname(v) !== 'fn') names.add(k);
    const tables = [...this.tables.keys()];
    const wt = this.whereTable && this.tb(this.whereTable);
    const types = {};
    for (const sc of this.scopes) for (const [k, v] of sc.names) types[k] = v;
    for (const m of [this.settings, this.lets, this.states]) for (const [k, v] of m) if (tname(v) !== 'fn') types[k] = v;
    for (const sc of this.scopes) for (const [k, v] of sc.names) types[k] = v; // inner scopes win
    const writable = [...names].filter(n => this.writable(n) && !this.lets.has(n));
    this.probe = { kind: 'head', mode, values: [...names], tables, whereFields: wt ? [...wt.fields.keys(), 'at', 'id'] : [], options: [...this.options], it: !!this.curIt(), itType: this.curIt(), types, writable };
  }
  probePart(t) {
    const n = tname(t);
    const out = [];
    if (n === 'row' || n === 'ref' || n === 'draft') {
      const tb = this.tb(t.table);
      if (tb) out.push(...tb.fields.keys(), 'at', 'id');
      if (n !== 'draft') for (const [name, b] of this.tables) if ([...b.fields.values()].filter(f => f.type.t === 'ref' && f.type.table === t.table).length === 1) out.push(name);
    } else if (n === 'rows' && !t.field) { const tb = this.tb(t.table); if (tb) out.push(...tb.fields.keys(), 'at'); }
    else if (n === 'rows' && t.field && tname(t.ftype) === 'ref') { const tb = this.tb(t.ftype.table); if (tb) out.push(...tb.fields.keys(), 'at'); }
    else if (n === 'group') { out.push('key'); const tb = this.tb(t.table); if (tb) out.push(...tb.fields.keys(), 'at'); }
    this.probe = { kind: 'part', parts: [...new Set(out)] };
  }

  path(p, mode = 'value') {
    let t;
    if (this.probeName && p.head === this.probeName) { this.probeHere(mode); return ANY; }
    if (p.head === 'it') {
      t = this.curIt();
      if (!t && this.failed.has('it')) { this.followOn('it'); return ANY; }
      if (!t) return this.err('E_CONTEXT', '"it" only exists inside each (and inside folds such as maxof).', this.itHint());
    } else {
      const wt = this.whereTable && this.tb(this.whereTable);
      const isField = wt && (wt.fields.has(p.head) || p.head === 'at' || p.head === 'id');
      if (isField) t = this.rowField(this.whereTable, p.head);
      else if (this.lookup(p.head)) t = this.lookup(p.head);
      else if (this.tables.has(p.head)) t = { t: 'rows', table: p.head };
      else if (!p.parts.length && this.options.has(p.head) && mode === 'value') return 'text'; // a bare pick option word
      else {
        if (this.followOn(p.head)) return ANY;
        const known = [...this.tables.keys(), ...this.settings.keys(), ...this.states.keys(), ...this.lets.keys()];
        return this.err(mode === 'rows' ? 'E_UNKNOWN_TABLE' : 'E_UNKNOWN_NAME', `"${p.head}" is not a table, setting, state or let declared above${this.whereTable ? `, nor a field of ${this.whereTable}` : ''}.`, known.length ? `use one of: ${known.join(', ')}; or declare it first.` : 'declare it first (table, setting or state).');
      }
      if (tname(t) === 'fn') return this.err('E_TYPE', `${p.head} is a formula with values; call it like ${p.head}(...).`, `write ${p.head}(value, ...).`);
    }
    for (const part of p.parts) {
      if (this.probeName && part === this.probeName) { this.probePart(t); return ANY; }
      if (isAny(t)) return t;
      t = this.step(t, part, p);
    }
    return t;
  }

  rowField(table, f) {
    if (f === 'at') return 'when';
    if (f === 'id') return 'num';
    const tb = this.tb(table);
    const fd = tb && tb.fields.get(f);
    return fd ? this.fieldType(fd.type) : ANY;
  }

  step(t, part, p) {
    const n = tname(t);
    const itNote = p && p.head === 'it' && (this.via || this.asNames().length) ? ' ' + this.itHint() : '';
    if (n === 'row' || n === 'ref' || n === 'draft') {
      const tb = this.tb(t.table);
      if (!tb) return ANY;
      if (this.failed.has(`${t.table}.${part}`)) return ANY; // that field's line failed; already reported
      if (tb.fields.has(part) || part === 'at' || part === 'id') return this.rowField(t.table, part);
      if (n !== 'draft') {
        const back = this.tb(part);
        if (back) {
          const refs = [...back.fields.values()].filter(f => f.type.t === 'ref' && f.type.table === t.table);
          if (refs.length === 1) return { t: 'rows', table: part, via: refs[0].name };
          if (refs.length > 1) return this.err('E_REF', `${part} has more than one link to ${t.table}, so .${part} is unclear.`, `use: ${part} where ${refs[0].name} = it.`);
          return this.err('E_REF', `${part} has no ref field pointing at ${t.table}${p && p.head === 'it' ? ` (here "it" is a ${t.table})` : ''}.`, (itNote.trim() || `add a field like "${t.table} ref ${t.table}" to table ${part}.`));
        }
      }
      return this.err('E_UNKNOWN_FIELD', `${t.table} has no field "${part}"${p && p.head === 'it' ? ` (here "it" is a ${t.table})` : ''}.`, `fields of ${t.table}: ${[...tb.fields.keys(), 'at'].join(', ')}.${itNote}`);
    }
    if (n === 'rows' && !t.field) {
      const tb = this.tb(t.table);
      if (!tb) return ANY;
      if (tb.fields.has(part) || part === 'at') return { ...t, field: part, ftype: this.rowField(t.table, part) };
      return this.err('E_UNKNOWN_FIELD', `${t.table} has no field "${part}".`, `fields of ${t.table}: ${[...tb.fields.keys(), 'at'].join(', ')}.`);
    }
    if (n === 'rows' && t.field && tname(t.ftype) === 'ref') {
      // a column of links followed further: drink.kind.name -> the name column of the linked rows
      const tb = this.tb(t.ftype.table);
      if (tb && (tb.fields.has(part) || part === 'at')) return { t: 'rows', table: t.table, field: t.field + '.' + part, ftype: this.rowField(t.ftype.table, part) };
    }
    if (n === 'group') {
      if (part === 'key') return t.key;
      const tb = this.tb(t.table);
      if (tb && (tb.fields.has(part) || part === 'at')) return { t: 'rows', table: t.table, field: part, ftype: this.rowField(t.table, part) };
      return this.err('E_UNKNOWN_FIELD', `a group has .key and the columns of ${t.table}; "${part}" is neither.`, 'use g.key, count(g) or sum(g.field).');
    }
    return this.err('E_TYPE', `${show(t)} has no part "${part}"${p && p.head === 'it' ? ' (here "it" is ' + show(t) + ')' : ''}.`, itNote.trim() || 'remove the .' + part + '.');
  }

  // ---------- queries, windows, sources ----------
  query(q, allowField = true) {
    let t = this.path(q.path, 'rows');
    if (isAny(t)) return t;
    if (tname(t) === 'group') t = { t: 'rows', table: t.table };
    if (tname(t) !== 'rows') {
      const shadow = q.path.parts.length && this.tb(q.path.parts[q.path.parts.length - 1]);
      return this.err('E_TYPE', `expected a table here, got ${show(t)}.`, shadow ? `"${q.path.parts[q.path.parts.length - 1]}" is read as a field, which hides the table of the same name; rename the field.` : 'name a table, like count(drink today).');
    }

    if (q.win) this.window(q.win);
    const tb = this.tb(t.table);

    if (q.by && tb) {

      this.scopes.push({ it: { t: 'row', table: t.table }, names: new Map(), each: true });

      this.scopes.pop();

  inWhere(table, f) { const o = this.whereTable; this.whereTable = table; try { f(); } finally { this.whereTable = o; } }

  // by a field reached through links: by dish.cuisine
  byPath(table, p) {

  window(w) {

  // ---------- targets and actions ----------
  target(p, allowDraftWhole = false) {

  }

  toggleT(s) {

  }
  whereEq(e, table) {
    const tb = this.tb(table);

  actions(list) { this.inAction++; try { for (const a of list) this.action(a); } finally { this.inAction--; } }
  action(a) {

        }

        if (!isAny(t) && tname(t) !== 'row') this.err('E_TYPE', `edit needs a row (like it), a setting or a state, got ${show(t)}.`, 'write edit it inside each, or edit goal.');
        return;
      }
      case 'remove': { const t = this.expr(a.e); if (!isAny(t) && tname(t) !== 'row') this.err('E_TYPE', `remove needs a row (like it), got ${show(t)}.`, 'write remove it inside each, or remove all TABLE where ....'); return; }

  optionOf(e) {

  assignable(target, val, what, e) {

    if (!this.compatible(target, val)) this.err('E_TYPE', `${what} is ${show(target)} but the value is ${show(val)}.`, family(target) === 'date' && dateSlip(e) ? 'write a date as year-month-day without quotes, for example 2026-11-30.' : 'give it a value of the same type.');

  }

  // ---------- expressions ----------

      if (n === 'draft' || n === 'color' || n === 'fn') this.err('E_TYPE', `${show(t)} cannot be shown as text.`, 'show one of its fields or call it.');

  expr(e) {

      case 'pi': return 'num';

  selfCompare(e) {

  agg(e) {

  fold(e) {

    this.scopes.pop();

  }

      for (const sc of root.screens) { const id = 'tab:' + sc.name; handlers.nodes.set(id, { tap: () => { this.screen = sc.name; } }); sc.id = id; }
    }
    root.children = this.render(this.prog.body, env, 'n', { top: true, main: !screens.length || this.screen === '_main' });
    return { tree: root, handlers };
  }

  render(list, env, pid, cx) {
    const out = [];
    let lastIf = null;
    list.forEach((s, i) => {
      const id = `${pid}.${i}`;
      try {
        const got = this.node(s, env, id, cx, lastIf);
        if (s.kind === 'if') lastIf = got.taken;
        else if (s.kind !== 'else') lastIf = null;
        if (!(cx.top && cx.main === false && s.kind !== 'screen')) out.push(...(got.nodes || []));
      } catch (e) {
        out.push({ id, t: 'error', text: String(e && e.message || e), line: s.line });
      }
    });
    return out;
  }

  style(mods, env) {
    const st = {};
    for (const m of mods || []) {
      switch (m.m) {
        case 'big': case 'head': case 'faint': st.role = m.m; break;
        case 'bold': case 'card': case 'grow': case 'middle': case 'full': case 'axes': case 'gridlines': st[m.m] = true; break;
        case 'size': case 'align': st[m.m] = m.v; break;
        case 'pad': case 'gap': case 'span': st[m.m] = m.v; break;
        case 'color': case 'fill': case 'stroke': { const v = this.evalIn(m.e, env); st[m.m] = v instanceof Color ? v.c : v === null ? null : String(v); break; }
        case 'tap': case 'swipe': case 'alt': case 'bar': break; // see events(): a11y and bar are node properties
        default: { const v = num(this.evalIn(m.e, env)); st[m.m] = v; }

    }
    return st;
  }
  events(mods, env, id, node) {
    const alt = (mods || []).find(m => m.m === 'alt');
    if (alt) node.a11y = alt.v; // the accessible name the author gave; nodes with their own text use that text
    if ((mods || []).some(m => m.m === 'bar')) node.bar = true;
    const tap = (mods || []).find(m => m.m === 'tap'), swipe = (mods || []).find(m => m.m === 'swipe');
    if (!tap && !swipe) return;
    const h = this.H.nodes.get(id) || {};
    if (tap) { h.tap = () => this.run(tap.actions, env, true); node.tap = true; node.action = tap.actions[0] && (tap.actions[0].a === 'param' ? 'other' : tap.actions[0].a); }
    if (swipe) { h.swipe = () => this.run(swipe.actions, env, true); node.swipe = true; }
    this.H.nodes.set(id, h);
  }

  stateKey(env, name) { return env.scope === '' ? `|${this.stk(name)}` : `${env.scope}|${name}`; }
  declareState(s, env) {
    const key = this.stateKey(env, s.name);
    if (!(key in this.data.state)) {
      if (s.draft) this.data.state[key] = this.newDraft(s.draft);
      else { const u = s.init ? this.unwrap(this.evalIn(s.init, env), s.type) : (s.type.t === 'bool' ? false : null); this.data.state[key] = u === REJECT ? null : u; }
    }
    else if (s.draft) this.data.state[key] = this.reconcileDraft(this.data.state[key], s.draft);
    env.vars.set(s.name, { state: key, type: s.draft ? { t: 'draft', table: s.draft } : s.type, keep: s.keep });
  }
  newDraft(table) {
    const d = {};
    const tb = this.env.tables.get(table);
    // a draft is keyed by field SLOT (and records its table slot), so it follows renames
    d._t = this.tk(table);
    for (const [n, f] of tb ? tb.fields : []) d[this.fk(table, n)] = this.draftDefault(f);
    return d;
  }
  draftDefault(f) { if (f.dflt) { const v = this.litValue(f.dflt, f.type); return v === REJECT ? null : v; } return f.type.t === 'bool' ? false : null; }
  // bring a draft in line with the form's current fields: renamed fields keep their value (same slot),
  // new fields get their default, dropped fields go, a value the field's type cannot hold is reset
  reconcileDraft(d, table) {
    const tb = this.env.tables.get(table);
    if (!tb || !d || typeof d !== 'object') return d;
    const out = { _t: this.tk(table), ...(d._missing ? { _missing: d._missing } : {}) };
    const legacy = d._t === undefined; // drafts saved before round 9 were keyed by field name
    for (const [n, f] of tb.fields) {
      const fk = this.fk(table, n);
      const v = legacy ? d[n] : d[fk];
      if (v === undefined) { out[fk] = this.draftDefault(f); continue; }
      out[fk] = v === null || this.fits(v, f.type) ? v : this.draftDefault(f);
    }
    if (out._missing) out._missing = out._missing.filter(n => tb.fields.has(n) && (out[this.fk(table, n)] === null || out[this.fk(table, n)] === ''));
    return out;
  }
  // can a stored value be read as this type?
  fits(v, type) {
    switch (type.t) {
      case 'num': case 'money': case 'dur': case 'time': case 'when': return typeof v === 'number';
      case 'date': return typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
      case 'bool': return typeof v === 'boolean';
      case 'pick': return isOptRef(v) && !!type.ids && v.o in type.ids;
      case 'ref': return typeof v === 'number';
      default: return typeof v === 'string' || isOptRef(v);
    }
  }

  node(s, env, id, cx, lastIf) {
    const N = (o) => { if (o.a11y === undefined && (o.label !== undefined || o.t === 'icon')) o.a11y = o.t === 'icon' ? o.name : o.label; return { nodes: [o] }; }; // a11y: the accessible name
    switch (s.kind) {
      case 'table': case 'setting': case 'remind': case 'def': return { nodes: [] };
      case 'state': this.declareState(s, env); return { nodes: [] };
      case 'let': if (!s.params) env.vars.set(s.name, { let: s.e, env }); return { nodes: [] };
      case 'every': this.H.every.push({ key: id, period: s.every * 1000, cond: s.cond ? () => this.evalIn(s.cond, env) : null, actions: s.actions, env }); return { nodes: [] };
      case 'when': this.H.when.push({ key: id, cond: () => this.evalIn(s.cond, env), actions: s.actions, env }); return { nodes: [] };
      case 'screen': {
        const visible = this.screen === s.name;
        const kids = this.render(s.children, this.child(env, {}), id, { top: false }); // hidden screens still run their states and events
        return visible ? N({ id, t: 'screen', name: s.name, label: s.label, children: kids }) : { nodes: [] };
      }
      case 'use': return { nodes: this.render(s.children, this.child(env, {}), id, cx) };
      case 'if': {
        const taken = this.truthy(this.evalIn(s.cond, env));
        return { taken, nodes: taken ? this.render(s.children, this.child(env, {}), id, cx) : [] };
      }
      case 'else': return { nodes: lastIf === false ? this.render(s.children, this.child(env, {}), id, cx) : [] };
      case 'each': {
        const items = this.sourceItems(s.source, env);
        const out = [];
        items.forEach((item, i) => {
          const key = item.key;
          const e2 = this.child(env, s.as ? { index: i, scope: `${env.scope}/${id}@${key}` } : { it: item.v, index: i, scope: `${env.scope}/${id}@${key}` });
          if (s.as) e2.vars.set(s.as, { value: item.v });
          out.push(...this.render(s.children, e2, `${id}@${key}`, cx));
        });
        if (!items.length && s.empty) out.push({ id: id + ':empty', t: 'text', text: s.empty, style: { role: 'faint' }, empty: true });
        return { nodes: out };
      }
      case 'box': {
        const node = { id, t: s.box, ...(s.cols ? { cols: s.cols } : {}), style: this.style(s.mods, env), children: this.render(s.children, this.child(env, {}), id, cx) };
        this.events(s.mods, env, id, node);

      }
      case 'draw': {
        const node = { id, t: 'draw', w: s.w, h: s.h, style: this.style(s.mods, env) };
        this.events(s.mods, env, id, node);
        node.children = this.render(s.children, this.child(env, { draw: { w: s.w, h: s.h } }), id, cx);
        return N(node);
      }
      case 'plot': {
        const rng = r => { let lo = num(this.evalIn(r[0], env)) ?? 0, hi = num(this.evalIn(r[1], env)) ?? 1; if (!(hi > lo)) hi = lo + 1; return [lo, hi]; };
        const x = rng(s.x), y = rng(s.y);
        const st = this.style(s.mods, env);
        const node = { id, t: 'plot', x, y, axes: !!st.axes, gridlines: !!st.gridlines, style: st };
        delete st.axes; delete st.gridlines;
        this.events(s.mods, env, id, node);
        const kids = this.render(s.children, this.child(env, { draw: { w: x[1] - x[0], h: y[1] - y[0], cx: (x[0] + x[1]) / 2, cy: (y[0] + y[1]) / 2 }, oldestFirst: true }), id, cx);
        const xt = kids.filter(k => k.t === 'tick' && k.axis !== 'y').map(k => ({ v: k.x, label: k.text }));
        const yt = kids.filter(k => k.t === 'tick' && k.axis === 'y').map(k => ({ v: k.x, label: k.text }));
        node.children = kids.filter(k => k.t !== 'tick');
        node.ticks = { x: xt.length ? xt : (node.axes ? niceTicks(x[0], x[1]).map(v => ({ v, label: fmt(v) })) : []), y: yt.length ? yt : node.axes || node.gridlines ? niceTicks(y[0], y[1]).map(v => ({ v, label: fmt(v) })) : [] };
        return N(node);
      }
      case 'tick': return N({ id, t: 'tick', axis: s.axis, x: num(this.evalIn(s.x, env)), text: this.textOf(s.parts, env) });
      case 'poly': {
        const pts = [];
        const collect = (list, e) => {
          let li = null;
          for (const c of list) {
            if (c.kind === 'pt') pts.push([num(this.evalIn(c.x, e)), num(this.evalIn(c.y, e))]);
            else if (c.kind === 'each') this.sourceItems(c.source, e).forEach((it, i) => { const e2 = this.child(e, c.as ? { index: i } : { it: it.v, index: i }); if (c.as) e2.vars.set(c.as, { value: it.v }); collect(c.children, e2); });
            else if (c.kind === 'if') { li = this.truthy(this.evalIn(c.cond, e)); if (li) collect(c.children, e); }
            else if (c.kind === 'else') { if (li === false) collect(c.children, e); }
            else if (c.kind === 'let') e.vars.set(c.name, { let: c.e, env: e });
          }
        };
        collect(s.children || [], this.child(env, {}));
        return N({ id, t: 'poly', points: pts, style: this.style(s.mods, env) });
      }
      case 'pt': return { nodes: [] };
      case 'shape': {
        const a = s.args.map(x => num(this.evalIn(x, env)));
        const d = env.draw || { w: 100, h: 100 };
        const node = { id, t: s.shape, style: this.style(s.mods, env) };
        if (s.shape === 'rect') Object.assign(node, { x: a[0], y: a[1], w: a[2], h: a[3] });
        if (s.shape === 'line') Object.assign(node, { x1: a[0], y1: a[1], x2: a[2], y2: a[3] });
        const ccx = d.cx ?? d.w / 2, ccy = d.cy ?? d.h / 2;
        if (s.shape === 'circle') Object.assign(node, a.length === 1 ? { cx: ccx, cy: ccy, r: a[0] } : { cx: a[0], cy: a[1], r: a[2] });
        if (s.shape === 'arc') Object.assign(node, a.length === 3 ? { cx: ccx, cy: ccy, r: a[0], from: a[1], to: a[2] } : { cx: a[0], cy: a[1], r: a[2], from: a[3], to: a[4] });

        if (s.shape === 'label') Object.assign(node, { x: a[0], y: a[1], text: this.textOf(s.parts, env) });

        return N(node);
      }
      case 'text': case 'button': {
        const node = { id, t: s.kind, text: this.textOf(s.parts, env), style: this.style(s.mods, env) };
        const typed = this.typedParts(s.parts, env);
        if (typed.some(p => p.t !== 'text')) node.parts = typed;

        return N(node);
      }
      case 'icon': {
        const e = s.icon;
        const name = e.k === 'path' && !e.parts.length && !this.lookup(e.head, env) ? e.head : fmt(this.evalIn(e, env), this);
        const node = { id, t: 'icon', name, style: this.style(s.mods, env) };
        this.events(s.mods, env, id, node);
        return N(node);
      }
      case 'image': return N({ id, t: 'image', src: this.evalIn(s.e, env), style: this.style(s.mods, env) });
      case 'space': return N({ id, t: 'space', size: s.size });
      case 'divider': return N({ id, t: 'divider' });
      case 'field': return N(this.fieldNode(s, env, id));
      case 'choice': {
        const ref = this.target(s.target, env);
        const type = ref.type;
        const options = type.t === 'pick' ? type.options : type.t === 'bool' ? [true, false] : type.t === 'ref' ? this.rows(type.table).map(r => r.id) : [];
        const labels = type.t === 'ref' ? options.map(i => this.summary(new Row(type.table, this.rows(type.table).find(r => r.id === i)))) : options.map(o => fmt(o));
        this.H.nodes.set(id, { change: v => { if (v === ref.raw()) return; ref.set(this.fromInput(v, type)); } });
        return N({ id, t: 'choice', label: (ref.label || s.target.parts[s.target.parts.length - 1] || s.target.head).replace(/_/g, ' '), value: ref.raw(), options, labels, style: this.style(s.mods, env) });
      }
      case 'slider': {
        const ref = this.target(s.target, env);
        this.H.nodes.set(id, { change: v => { if (v === ref.raw()) return; const x = this.fromInput(v, ref.type); if (x !== null) ref.set(x); } }); // a slider always has a value
        return N({ id, t: 'slider', value: ref.raw(), min: s.range.lo, max: s.range.hi, style: this.style(s.mods, env) });
      }
      case 'toggle': {
        const node = { id, t: 'toggle', label: this.toggleLabel(s, env), style: this.style(s.mods, env) };
        const t = this.evalPathRaw(s.target, env);
        if (t instanceof RowSet) {
          node.on = this.matchToggle(s.target, s.win, s.where, env).length > 0;
          this.H.nodes.set(id, { tap: () => this.doToggle(s.target, s.win, s.where, env) });
        } else {
          const ref = this.target(s.target, env);
          node.on = ref.raw() === true;
          this.H.nodes.set(id, { tap: () => ref.set(!(ref.raw() === true)) });

        return N(node);
      }
    }
    return { nodes: [] };
  }

  // an accessible name for a tick box: the value it shows (where name = it), else its target in words
  toggleLabel(s, env) {
    if (s.where && s.where.k === 'bin' && s.where.op === '=') { const v = this.evalIn(s.where.b, env); if (v !== null && typeof v !== 'object') return fmt(v, this); }
    const words = [s.target.head === 'it' ? null : s.target.head, ...s.target.parts].filter(Boolean).map(x => x.replace(/_/g, ' ')).join(' ');
    const it = this.nearestIt(env);
